<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>豆豆 · 专属相册</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Preload key sweep & landing photos for instant zero-wait display -->
  <link rel="preload" as="image" href="./photos/16.jpg" fetchpriority="high" />
  <link rel="preload" as="image" href="./photos/15.jpg" fetchpriority="high" />
  <link rel="preload" as="image" href="./photos/17.jpg" fetchpriority="high" />
  <link rel="preload" as="image" href="./photos/14.jpg" />
  <link rel="preload" as="image" href="./photos/18.jpg" />
  <link rel="preload" as="image" href="./photos/1.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #F6F3EC;
      --bg-secondary: #EDE8DF;
      --text-main: #2A2522;
      --text-muted: #7D746B;
      --gold-accent: #B69566;
      --gold-light: #DFC9A6;
      --card-bg: #FCFBF9;
      --frame-outer: #382E27;
      --frame-mat: #FAF8F3;
      --shadow-ambient: rgba(42, 37, 34, 0.14);
      --pill-bg: rgba(252, 251, 249, 0.94);
      --pill-border: rgba(182, 149, 102, 0.42);
    }

    body.dark-theme {
      --bg-primary: #0F0E13;
      --bg-secondary: #181720;
      --text-main: #F5EFE6;
      --text-muted: #A69C8E;
      --gold-accent: #D8B888;
      --gold-light: #9E8259;
      --card-bg: #1E1C26;
      --frame-outer: #221C18;
      --frame-mat: #17161D;
      --shadow-ambient: rgba(0, 0, 0, 0.68);
      --pill-bg: rgba(28, 26, 35, 0.94);
      --pill-border: rgba(216, 184, 136, 0.38);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .font-serif-display {
      font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
    }

    /* ============================================================
       FLICKER-FREE DUAL-LAYER GPU BACKDROP (彻底解决平板端切换深色闪烁)
       iPad Safari 对 complex radial-gradient 直接做 transition 会触发整屏闪烁，
       改为双层固定背景 + 纯 GPU Opacity 交叉淡入淡出，切换如丝绸般顺滑零闪烁！
       ============================================================ */
    .gallery-backdrop-light,
    .gallery-backdrop-dark {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gallery-backdrop-light {
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 252, 245, 0.78) 0%, transparent 68%),
        radial-gradient(circle at 85% 15%, rgba(182, 149, 102, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 15% 85%, rgba(182, 149, 102, 0.07) 0%, transparent 50%),
        #F6F3EC;
      opacity: 1;
    }

    .gallery-backdrop-dark {
      background:
        radial-gradient(circle at 50% 38%, rgba(216, 184, 136, 0.14) 0%, rgba(46, 39, 36, 0.24) 36%, transparent 72%),
        radial-gradient(ellipse at 50% 0%, rgba(216, 184, 136, 0.11) 0%, transparent 55%),
        radial-gradient(circle at 82% 18%, rgba(186, 148, 98, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 18% 82%, rgba(120, 98, 140, 0.07) 0%, transparent 50%),
        linear-gradient(180deg, #131218 0%, #0D0C11 100%);
      opacity: 0;
    }

    body.dark-theme .gallery-backdrop-light {
      opacity: 0;
    }
    body.dark-theme .gallery-backdrop-dark {
      opacity: 1;
    }

    .gallery-wainscot {
      position: fixed;
      inset: 12px;
      border: 1px solid rgba(182, 149, 102, 0.22);
      pointer-events: none;
      z-index: 2;
      transform: translateZ(0);
    }
    .gallery-wainscot::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(182, 149, 102, 0.09);
    }

    body.dark-theme .gallery-wainscot {
      border-color: rgba(216, 184, 136, 0.28);
    }
    body.dark-theme .gallery-wainscot::before {
      border-color: rgba(216, 184, 136, 0.12);
    }

    /* Adaptive UI Glass Pills */
    .ui-pill {
      background-color: var(--pill-bg);
      border: 1px solid var(--pill-border);
      color: var(--text-main);
      transform: translateZ(0);
    }
    body.dark-theme .ui-pill {
      box-shadow:
        0 8px 24px -4px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 0 rgba(255, 244, 224, 0.12);
    }
    .ui-pill:hover {
      border-color: var(--gold-accent);
    }

    /* Cute Animated Puppy Styles */
    @keyframes puppyBounce {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(2deg); }
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(22deg); }
    }
    @keyframes earFlopLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes earFlopRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes heartFloat {
      0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.75; }
      50% { transform: translateY(-4px) scale(1.12); opacity: 1; }
    }

    .puppy-avatar {
      animation: puppyBounce 2.2s ease-in-out infinite;
    }
    .puppy-tail {
      transform-origin: 48px 42px;
      animation: tailWag 0.45s ease-in-out infinite;
    }
    .puppy-ear-l {
      transform-origin: 20px 20px;
      animation: earFlopLeft 1.1s ease-in-out infinite;
    }
    .puppy-ear-r {
      transform-origin: 44px 20px;
      animation: earFlopRight 1.1s ease-in-out infinite;
    }
    .puppy-eyes {
      transform-origin: 32px 28px;
      animation: eyeBlink 3.6s infinite;
    }
    .puppy-heart {
      animation: heartFloat 1.8s ease-in-out infinite;
    }

    /* High-Performance 3D Stage */
    .album-stage-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1600px;
      z-index: 10;
      transition: transform 0.82s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.72s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, opacity;
      touch-action: none;
    }

    .album-stage-wrapper.sunken {
      transform: translateY(35vh) scale(0.66);
      opacity: 0.48;
    }

    .album-track {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    /* ============================================================
       FLICKER-FREE 3D ALBUM CARD (不在 3D 卡片上挂载 background/shadow 过渡)
       ============================================================ */
    .album-card {
      position: absolute;
      width: 280px;
      height: 356px;
      left: -140px;
      top: -178px;
      background-color: var(--card-bg);
      border-radius: 6px;
      padding: 15px 15px 17px 15px;
      box-shadow:
        0 20px 44px -12px var(--shadow-ambient),
        0 4px 12px -2px rgba(0, 0, 0, 0.06),
        inset 0 0 0 1px rgba(182, 149, 102, 0.32);
      cursor: pointer;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    body.dark-theme .album-card {
      background-color: #1E1C26;
      box-shadow:
        0 22px 48px -10px rgba(0, 0, 0, 0.78),
        inset 0 1px 0 0 rgba(255, 242, 218, 0.15),
        inset 0 0 0 1px rgba(216, 184, 136, 0.34);
    }

    body.dark-theme .album-card.is-center {
      box-shadow:
        0 26px 56px -10px rgba(0, 0, 0, 0.85),
        0 0 32px -4px rgba(216, 184, 136, 0.2),
        inset 0 1px 0 0 rgba(255, 245, 225, 0.26),
        inset 0 0 0 1.5px rgba(216, 184, 136, 0.62);
    }

    @media (max-width: 640px) {
      .album-card {
        width: 232px;
        height: 306px;
        left: -116px;
        top: -153px;
        padding: 12px 12px 14px 12px;
      }
    }

    .album-card::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(182, 149, 102, 0.18);
      border-radius: 3px;
      pointer-events: none;
    }

    .album-card.is-center::before {
      border-color: rgba(182, 149, 102, 0.58);
    }
    body.dark-theme .album-card.is-center::before {
      border-color: rgba(216, 184, 136, 0.55);
    }

    .album-card.extracted-slot .card-inner-content {
      opacity: 0.14;
      transform: scale(0.92);
      filter: grayscale(0.8);
    }
    .album-card.extracted-slot::after {
      content: '正在上方展映';
      position: absolute;
      inset: 16px;
      border: 1.5px dashed rgba(182, 149, 102, 0.65);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--gold-accent);
      font-weight: 500;
      background: rgba(182, 149, 102, 0.05);
    }

    .card-inner-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .photo-viewport {
      position: relative;
      width: 100%;
      height: 254px;
      overflow: hidden;
      background-color: #E5E0D5;
      border-radius: 2px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
    }
    body.dark-theme .photo-viewport {
      background-color: #14131A;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.55);
    }

    @media (max-width: 640px) {
      .photo-viewport {
        height: 212px;
      }
    }

    .photo-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      display: block;
      transform: translateZ(0);
    }

    /* Diagonal shimmer sheen on photo */
    .photo-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, transparent 30%, rgba(255, 255, 255, 0.28) 48%, transparent 66%);
      transform: translateX(-120%);
      transition: transform 0.75s ease;
      pointer-events: none;
    }
    .album-card:hover .photo-shimmer,
    .album-card.is-center .photo-shimmer {
      transform: translateX(120%);
    }

    .corner-mount {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--gold-accent);
      border-style: solid;
      z-index: 4;
      pointer-events: none;
      opacity: 0.85;
    }
    .corner-tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

    .invite-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(38, 32, 28, 0.82);
      color: #F7EFE2;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(212, 182, 132, 0.55);
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 5;
    }
    .album-card.is-center .invite-badge,
    .album-card:hover .invite-badge {
      opacity: 1;
      transform: translateY(0);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #E6C387;
    }

    /* Dot scroll container */
    .dots-scroll-box {
      max-width: min(42vw, 320px);
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 4px;
      scroll-behavior: smooth;
    }
    .dots-scroll-box::-webkit-scrollbar {
      display: none;
    }

    /* Floating Screen Navigation Arrows for Strip View */
    .strip-stage-nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%) translateZ(0);
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background-color: var(--pill-bg);
      border: 1px solid var(--pill-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px -4px rgba(42, 37, 34, 0.16);
      z-index: 25;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }
    body.dark-theme .strip-stage-nav-btn {
      box-shadow:
        0 10px 26px -4px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 0 rgba(255, 242, 218, 0.14);
    }
    .strip-stage-nav-btn:hover {
      background-color: var(--gold-accent);
      color: #17161C;
      transform: translateY(-50%) scale(1.06) translateZ(0);
    }
    .strip-stage-nav-btn.prev {
      left: 14px;
    }
    .strip-stage-nav-btn.next {
      right: 14px;
    }
    @media (max-width: 640px) {
      .strip-stage-nav-btn {
        width: 38px;
        height: 38px;
      }
      .strip-stage-nav-btn.prev { left: 8px; }
      .strip-stage-nav-btn.next { right: 8px; }
    }

    /* ============================================================
       EXTRACTED SINGLE PHOTO STAGE (精致相框单独查看层)
       ============================================================ */
    .single-stage-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      perspective: 1600px;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      touch-action: none;
    }

    .single-stage-overlay.active {
      pointer-events: auto;
      opacity: 1;
    }

    .single-backdrop-veil {
      position: absolute;
      inset: 0;
      background: rgba(246, 243, 236, 0.88);
      z-index: -1;
    }
    body.dark-theme .single-backdrop-veil {
      background: radial-gradient(circle at 50% 42%, rgba(28, 25, 34, 0.9) 0%, rgba(11, 10, 15, 0.96) 100%);
    }

    .exquisite-frame-wrapper {
      position: relative;
      transform-style: preserve-3d;
      transform: translateY(210px) scale(0.52) rotateX(14deg);
      transition: transform 0.72s cubic-bezier(0.19, 1, 0.22, 1),
                  opacity 0.52s ease;
      will-change: transform, opacity;
      max-width: 92vw;
      margin-bottom: 5vh;
      cursor: grab;
    }
    .exquisite-frame-wrapper:active {
      cursor: grabbing;
    }

    .single-stage-overlay.active .exquisite-frame-wrapper {
      transform: translateY(-16px) scale(1) rotateX(0deg);
    }

    .exquisite-frame-wrapper.no-transition {
      transition: none !important;
    }

    /* Distinct Single-View 3D Horizontal Switch Animations */
    @keyframes singleSlideOutLeft {
      0% { transform: translateY(-16px) translateX(0) translateZ(0) rotateY(0deg); opacity: 1; }
      100% { transform: translateY(-16px) translateX(-52%) translateZ(-160px) rotateY(-32deg) rotateZ(-2deg); opacity: 0; }
    }
    @keyframes singleSlideInRight {
      0% { transform: translateY(-16px) translateX(52%) translateZ(-160px) rotateY(32deg) rotateZ(2deg); opacity: 0; }
      100% { transform: translateY(-16px) translateX(0) translateZ(0) rotateY(0deg) rotateZ(0deg); opacity: 1; }
    }
    @keyframes singleSlideOutRight {
      0% { transform: translateY(-16px) translateX(0) translateZ(0) rotateY(0deg); opacity: 1; }
      100% { transform: translateY(-16px) translateX(52%) translateZ(-160px) rotateY(32deg) rotateZ(2deg); opacity: 0; }
    }
    @keyframes singleSlideInLeft {
      0% { transform: translateY(-16px) translateX(-52%) translateZ(-160px) rotateY(-32deg) rotateZ(-2deg); opacity: 0; }
      100% { transform: translateY(-16px) translateX(0) translateZ(0) rotateY(0deg) rotateZ(0deg); opacity: 1; }
    }

    .exquisite-frame-wrapper.anim-out-left {
      animation: singleSlideOutLeft 0.32s cubic-bezier(0.4, 0, 0.8, 0.6) forwards;
    }
    .exquisite-frame-wrapper.anim-in-right {
      animation: singleSlideInRight 0.44s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }
    .exquisite-frame-wrapper.anim-out-right {
      animation: singleSlideOutRight 0.32s cubic-bezier(0.4, 0, 0.8, 0.6) forwards;
    }
    .exquisite-frame-wrapper.anim-in-left {
      animation: singleSlideInLeft 0.44s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    .museum-outer-frame {
      position: relative;
      background: linear-gradient(145deg, #43372E 0%, #29211B 50%, #3B3028 100%);
      padding: 13px;
      border-radius: 8px;
      box-shadow:
        0 34px 70px -15px rgba(28, 22, 18, 0.42),
        0 10px 24px -6px rgba(28, 22, 18, 0.24),
        inset 0 0 0 2px #8B6F47;
    }

    body.dark-theme .museum-outer-frame {
      background: linear-gradient(145deg, #2D2520 0%, #191512 50%, #261F1B 100%);
      box-shadow:
        0 34px 75px -10px rgba(0, 0, 0, 0.88),
        0 0 42px -8px rgba(216, 184, 136, 0.22),
        inset 0 0 0 2px #B59260;
    }

    .museum-mat-board {
      position: relative;
      background-color: var(--frame-mat);
      padding: 24px 26px 18px 26px;
      border-radius: 3px;
      border: 2px solid #C6A677;
    }
    body.dark-theme .museum-mat-board {
      border-color: rgba(216, 184, 136, 0.55);
      box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.65);
    }

    @media (max-width: 640px) {
      .museum-outer-frame { padding: 9px; }
      .museum-mat-board { padding: 14px 14px 12px 14px; }
    }

    .museum-image-bevel {
      position: relative;
      width: min(550px, 78vw);
      height: min(385px, 51vh);
      padding: 5px;
      background: linear-gradient(135deg, #D5BC94 0%, #9E7F53 50%, #E7D4B5 100%);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .museum-image-bevel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #E8E3D9;
      pointer-events: none;
    }

    .frame-filigree {
      position: absolute;
      width: 26px;
      height: 26px;
      pointer-events: none;
      z-index: 5;
      color: #D6B785;
      opacity: 0.9;
    }
    .filigree-tl { top: 6px; left: 6px; }
    .filigree-tr { top: 6px; right: 6px; transform: scaleX(-1); }
    .filigree-bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
    .filigree-br { bottom: 6px; right: 6px; transform: scale(-1, -1); }

    .museum-plaque {
      margin-top: 14px;
      padding: 9px 18px;
      background: rgba(198, 166, 119, 0.16);
      border-top: 1px solid rgba(182, 149, 102, 0.42);
      border-bottom: 1px solid rgba(182, 149, 102, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    body.dark-theme .museum-plaque {
      background: linear-gradient(90deg, rgba(216, 184, 136, 0.05) 0%, rgba(216, 184, 136, 0.18) 50%, rgba(216, 184, 136, 0.05) 100%);
      border-color: rgba(216, 184, 136, 0.45);
    }

    /* Vinyl Disc */
    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .vinyl-disc {
      animation: spinVinyl 6s linear infinite;
      animation-play-state: paused;
    }
    .vinyl-disc.playing {
      animation-play-state: running;
    }

    /* Equalizer */
    @keyframes eqBar1 { 0%, 100% { height: 4px; } 50% { height: 14px; } }
    @keyframes eqBar2 { 0%, 100% { height: 13px; } 40% { height: 4px; } 80% { height: 15px; } }
    @keyframes eqBar3 { 0%, 100% { height: 6px; } 60% { height: 16px; } }
    .eq-bar {
      width: 2.5px;
      background: var(--gold-accent);
      border-radius: 2px;
      height: 4px;
    }
    .playing .eq-bar-1 { animation: eqBar1 0.8s infinite ease-in-out; }
    .playing .eq-bar-2 { animation: eqBar2 0.7s infinite ease-in-out; }
    .playing .eq-bar-3 { animation: eqBar3 0.9s infinite ease-in-out; }
    .playing .eq-bar-4 { animation: eqBar1 0.65s infinite ease-in-out 0.2s; }

    @keyframes swipeDownHint {
      0%, 100% { transform: translateY(0); opacity: 0.85; }
      50% { transform: translateY(4px); opacity: 1; }
    }
    .swipe-down-pill {
      animation: swipeDownHint 2.2s infinite ease-in-out;
    }

    .welcome-card {
      background-color: var(--card-bg);
      border: 1px solid var(--pill-border);
      color: var(--text-main);

  <!-- ============================================================
       GRACEFUL 32-PHOTO SWEEP & HIGH-SPEED IMAGE ENGINE
       ============================================================ -->
  <script>
    const USER_CONFIG = {
      photoFolder: './photos/',
      musicFile: './music/bgm.mp3',
      photoCount: 32
    };

    const BUILTIN_PREVIEW_PHOTOS = [];

    const state = {
      photos: [],
      viewMode: 'strip',
      activeIndex: 15,          // 默认黄金中心位（第16张）
      scrollX: 15,
      targetScrollX: 15,
      velocityX: 0,
      isDraggingStrip: false,
      dragMoved: false,
      pointerStartX: 0,
      pointerStartY: 0,
      lastPointerX: 0,
      lastPointerTime: 0,

      // 原汁原味优美入场动画：完整流光掠过全部 32 张照片，由快到慢优雅停驻在正中央
      introSweepActive: false,
      introBraking: false,
      introStartTime: 0,
      introDuration: 2000,
      introStartScroll: -17,
      introEndScroll: 15,

      // Single view gesture
      isDraggingSingle: false,
      singleDragDX: 0,
      singleDragDY: 0,
      isTransitioningSingle: false,

      // Audio state
      isPlayingMusic: false
    };

    // DOM References
    const albumStageWrapper = document.getElementById('albumStageWrapper');
    const albumTrack = document.getElementById('albumTrack');
    const stripStagePrevBtn = document.getElementById('stripStagePrevBtn');
    const stripStageNextBtn = document.getElementById('stripStageNextBtn');
    const singleStageOverlay = document.getElementById('singleStageOverlay');
    const exquisiteFrameWrapper = document.getElementById('exquisiteFrameWrapper');
    const singleFramedImg = document.getElementById('singleFramedImg');
    const singleFramedTitle = document.getElementById('singleFramedTitle');
    const statusToast = document.getElementById('statusToast');
    const counterText = document.getElementById('counterText');
    const modeStatusText = document.getElementById('modeStatusText');
    const dotIndicators = document.getElementById('dotIndicators');
    const stripFooterBar = document.getElementById('stripFooterBar');

    const bgmAudio = document.getElementById('bgmAudio');
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const vinylDisc = document.getElementById('vinylDisc');
    const eqContainer = document.getElementById('eqContainer');
    const musicStateLabel = document.getElementById('musicStateLabel');
    const welcomeVeil = document.getElementById('welcomeVeil');
    const enterGalleryBtn = document.getElementById('enterGalleryBtn');

    let cardElements = [];

    function wrapIndex(idx, total) {
      if (total <= 0) return 0;
      return ((Math.round(idx) % total) + total) % total;
    }

    function getCircularOffset(i, scrollX, total) {
      if (total <= 1) return 0;
      let diff = (i - scrollX) % total;
      if (diff > total / 2) diff -= total;
      if (diff < -total / 2) diff += total;
      return diff;
    }

    function getNearestTargetScroll(currentScroll, targetIdx, total) {
      if (total <= 1) return 0;
      const diff = getCircularOffset(targetIdx, currentScroll, total);
      return Math.round(currentScroll + diff);
    }

    /******************************************************************
     * 1. NATIVE EAGER HIGH-SPEED PHOTO INITIALIZATION
     * 直接挂载全部 32 张图片的 src（移除 JS 队列延迟和 opacity:0 等待），
     * 并对中心及入场轨迹上的关键卡片赋予 fetchpriority="high"，让浏览器底层全速并行解码！
     ******************************************************************/
    function init32Photos() {
      const isBuiltin = Array.isArray(BUILTIN_PREVIEW_PHOTOS) && BUILTIN_PREVIEW_PHOTOS.length > 0;
      const folder = USER_CONFIG.photoFolder;

      state.photos = Array.from({ length: USER_CONFIG.photoCount }, (_, idx) => {
        const url = isBuiltin
          ? BUILTIN_PREVIEW_PHOTOS[idx % BUILTIN_PREVIEW_PHOTOS.length].url
          : `${folder}${idx + 1}.jpg`;
        return {
          id: idx,
          num: idx + 1,
          resolvedSrc: url,
          caption: '开开心心'
        };
      });

      buildAlbumDOM(isBuiltin);
      updateCounterDisplay();
    }

    function tryFallbackExtensions(num, idx, imgEl) {
      const folder = USER_CONFIG.photoFolder;
      const exts = ['.JPG', '.png', '.PNG', '.jpeg', '.webp'];
      let cursor = 0;

      function nextExt() {
        if (cursor >= exts.length) return;
        const candidate = `${folder}${num}${exts[cursor++]}`;
        const tester = new Image();
        tester.onload = () => {
          state.photos[idx].resolvedSrc = candidate;
          imgEl.src = candidate;
        };
        tester.onerror = nextExt;
        tester.src = candidate;
      }
      nextExt();
    }

    /******************************************************************
     * 2. RENDER 32 ALBUM CARDS & DOTS (保留原版流光掠过光泽与角落金扣)
     ******************************************************************/
    function buildAlbumDOM(isBuiltin) {
      albumTrack.innerHTML = '';
      dotIndicators.innerHTML = '';
      cardElements = [];

      const total = state.photos.length;

      for (let idx = 0; idx < total; idx++) {
        const photo = state.photos[idx];
        const card = document.createElement('article');
        card.className = 'album-card';
        card.dataset.index = String(idx);

        // 对中心停靠区 (11..19) 与入场起始区设置高优提取，其余图片同样直接挂 src 立即并行加载
        const isHighPriority = Math.abs(getCircularOffset(idx, 15, total)) <= 4 || idx === 0;

        card.innerHTML = `
          <div class="card-inner-content">
            <div class="photo-viewport">
              <span class="corner-mount corner-tl"></span>
              <span class="corner-mount corner-tr"></span>
              <span class="corner-mount corner-bl"></span>
              <span class="corner-mount corner-br"></span>
              <img src="${photo.resolvedSrc}" alt="开开心心" decoding="async" loading="eager" ${isHighPriority ? 'fetchpriority="high"' : ''} draggable="false" />
              <div class="photo-shimmer"></div>
              <div class="invite-badge">
                <span class="pulse-dot"></span>
                <span>查看装裱</span>
              </div>
            </div>

            <div class="pt-2 flex items-center justify-center gap-2">
              <span class="text-[var(--gold-accent)] text-xs">✦</span>
              <h3 class="font-serif-display text-base font-semibold tracking-[0.22em] text-[var(--text-main)]">开开心心</h3>
              <span class="text-[var(--gold-accent)] text-xs">✦</span>
            </div>
          </div>
        `;

        if (!isBuiltin) {
          const imgEl = card.querySelector('img');
          imgEl.addEventListener('error', function onErr() {
            imgEl.removeEventListener('error', onErr);
            tryFallbackExtensions(photo.num, idx, imgEl);
          });
        }

        card.addEventListener('click', (e) => {
          e.stopPropagation();
          handleCardClick(idx);
        });

        albumTrack.appendChild(card);
        cardElements.push(card);

        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'h-1.5 rounded-full transition-all duration-300 bg-[#B69566]/35 hover:bg-[#B69566] w-1.5 flex-shrink-0';
        dot.title = `第 ${idx + 1} 张 · 开开心心`;
        dot.addEventListener('click', () => {
          if (state.introSweepActive) {
            triggerIntroSmoothBrake(idx);
          } else if (state.viewMode === 'strip') {
            focusCardToRealIndex(idx);
          } else {
            switchSinglePhotoTo(idx, idx > state.activeIndex ? 'next' : 'prev');
          }
        });
        dotIndicators.appendChild(dot);
      }

      if (singleFramedImg && state.photos[15]) {
        singleFramedImg.src = state.photos[15].resolvedSrc;
      }

      updateDotsUI();
      updateCounterDisplay();
    }

    function updateCounterDisplay() {
      if (!counterText) return;
      const total = state.photos.length;
      const current = wrapIndex(state.scrollX, total) + 1;
      counterText.textContent = `第 ${current} / ${total} 张 · 开开心心 🐾`;
    }

    function updateDotsUI() {
      const dots = dotIndicators.children;
      const total = state.photos.length;
      if (total === 0) return;
      const centerRealIdx = wrapIndex(state.scrollX, total);
      const highlightIdx = state.viewMode === 'single' ? state.activeIndex : centerRealIdx;

      for (let i = 0; i < dots.length; i++) {
        if (i === highlightIdx) {
          dots[i].className = 'h-1.5 rounded-full transition-all duration-300 bg-[var(--gold-accent)] w-5 flex-shrink-0';
          if (dots[i].scrollIntoView) {
            dots[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          }
        } else {
          dots[i].className = 'h-1.5 rounded-full transition-all duration-300 bg-[#B69566]/30 hover:bg-[#B69566]/60 w-1.5 flex-shrink-0';
        }
      }
    }

    function showToast(msg) {
      if (!statusToast) return;
      if (counterText) counterText.textContent = msg;
    }

    /******************************************************************
     * 3. ORIGINAL GRACEFUL OPENING SWEEP (完整保留原本32张优美流光掠过动画)
     * 从 -(total - goldenCenterIndex) 完整掠过一整圈全部 32 张照片，
     * 在 2.0 秒内由快到慢（带优美 3D 扇形侧倾与流光动感）稳稳停在黄金中心位（第16张）！
     ******************************************************************/
    function startOpeningAlbumSweep() {
      if (state.viewMode === 'single') {
        exitSingleView(true);
      }

      const total = state.photos.length;
      const goldenCenterIndex = 15;

      // 完整还原原本跨越整圈 32 张照片的优美入场动画！
      state.introStartScroll = -(total - goldenCenterIndex);
      state.introEndScroll = goldenCenterIndex;
      state.scrollX = state.introStartScroll;
      state.targetScrollX = state.introEndScroll;
      state.activeIndex = goldenCenterIndex;
      state.velocityX = 0;

      state.introSweepActive = true;
      state.introBraking = false;
      state.introDuration = 2000;
      state.introStartTime = performance.now();

      showToast(`✨ 不必考虑太多，享受当下 🐾`);
    }

    function triggerIntroSmoothBrake(preferredRealIndex = null) {
      if (!state.introSweepActive || state.introBraking) return;
      state.introBraking = true;
      state.introSweepActive = false;

      const total = state.photos.length;
      let landingScroll;
      if (preferredRealIndex !== null) {
        landingScroll = getNearestTargetScroll(state.scrollX, preferredRealIndex, total);
      } else {
        landingScroll = Math.round(state.scrollX + 0.35);
      }

      state.targetScrollX = landingScroll;
      state.activeIndex = wrapIndex(landingScroll, total);
      updateCounterDisplay();
    }

    function stepStripBy(deltaSteps) {
      state.introSweepActive = false;
      state.introBraking = false;
      state.velocityX = 0;
      state.targetScrollX = Math.round(state.targetScrollX + deltaSteps);
      state.activeIndex = wrapIndex(state.targetScrollX, state.photos.length);
      updateCounterDisplay();
    }

    function focusCardToRealIndex(realIndex) {
      const total = state.photos.length;
      state.introSweepActive = false;
      state.introBraking = false;
      state.velocityX = 0;
      const diff = getCircularOffset(realIndex, state.targetScrollX, total);
      state.targetScrollX = Math.round(state.targetScrollX + diff);
      state.activeIndex = wrapIndex(state.targetScrollX, total);
      updateCounterDisplay();
    }

    /******************************************************************
     * 4. CARD CLICK -> EXTRACT PHOTO UPWARD INTO MUSEUM FRAME
     ******************************************************************/
    function handleCardClick(realIndex) {
      if (state.dragMoved) return;

      if (state.introSweepActive) {
        triggerIntroSmoothBrake(realIndex);
        return;
      }

      if (state.viewMode === 'single') {
        if (realIndex !== state.activeIndex) {
          const diff = getCircularOffset(realIndex, state.activeIndex, state.photos.length);
          switchSinglePhotoTo(realIndex, diff >= 0 ? 'next' : 'prev');
        }
        return;
      }

      const total = state.photos.length;
      const offset = getCircularOffset(realIndex, state.scrollX, total);
      state.targetScrollX = Math.round(state.scrollX + offset);
      enterSingleView(realIndex);
    }

    function enterSingleView(realIndex) {
      const total = state.photos.length;
      const clamped = wrapIndex(realIndex, total);
      state.activeIndex = clamped;
      state.velocityX = 0;
      state.viewMode = 'single';

      populateSingleFrameContent(clamped);

      cardElements.forEach((el, idx) => {
        el.classList.toggle('extracted-slot', idx === clamped);
      });

      albumStageWrapper.classList.add('sunken');
      singleStageOverlay.classList.add('active');
      singleStageOverlay.setAttribute('aria-hidden', 'false');
      stripFooterBar.style.opacity = '0';
      stripFooterBar.style.pointerEvents = 'none';

      modeStatusText.textContent = `DOUDOU GALLERY · 第 ${clamped + 1} / ${total} 张 · 开开心心`;
      updateDotsUI();
    }

    function populateSingleFrameContent(index) {
      const item = state.photos[index];
      if (!item) return;
      singleFramedImg.src = item.resolvedSrc;
      singleFramedImg.alt = '开开心心';
      singleFramedTitle.textContent = '开开心心';
    }

    /******************************************************************
     * 5. SWIPE DOWN OR CLICK TO RETURN TO ALBUM STRIP CENTER
     ******************************************************************/
    function exitSingleView(instant = false) {
      if (state.viewMode !== 'single') return;
      state.viewMode = 'strip';

      const total = state.photos.length;
      const diff = getCircularOffset(state.activeIndex, state.scrollX, total);
      state.targetScrollX = Math.round(state.scrollX + diff);
      if (instant) {
        state.scrollX = state.targetScrollX;
      }

      exquisiteFrameWrapper.classList.remove('no-transition', 'anim-out-left', 'anim-in-right', 'anim-out-right', 'anim-in-left');
      exquisiteFrameWrapper.style.transform = '';
      exquisiteFrameWrapper.style.opacity = '';
      albumStageWrapper.style.transform = '';
      albumStageWrapper.style.opacity = '';

      albumStageWrapper.classList.remove('sunken');
      singleStageOverlay.classList.remove('active');
      singleStageOverlay.setAttribute('aria-hidden', 'true');

      cardElements.forEach((el) => el.classList.remove('extracted-slot'));

      stripFooterBar.style.opacity = '1';
      stripFooterBar.style.pointerEvents = 'none';

      modeStatusText.textContent = `DOUDOU GALLERY`;
      updateDotsUI();
      updateCounterDisplay();
    }

    /******************************************************************
     * 6. SWITCH PHOTO IN SINGLE VIEW
     ******************************************************************/
    function switchSinglePhotoTo(newIndex, direction = 'next') {
      if (state.isTransitioningSingle || state.photos.length <= 1) return;
      const total = state.photos.length;
      const wrappedIndex = wrapIndex(newIndex, total);
      if (wrappedIndex === state.activeIndex) return;

      state.isTransitioningSingle = true;
      exquisiteFrameWrapper.classList.remove('no-transition', 'anim-out-left', 'anim-in-right', 'anim-out-right', 'anim-in-left');
      exquisiteFrameWrapper.style.transform = '';

      const outClass = direction === 'next' ? 'anim-out-left' : 'anim-out-right';
      const inClass = direction === 'next' ? 'anim-in-right' : 'anim-in-left';

      exquisiteFrameWrapper.classList.add(outClass);

      state.activeIndex = wrappedIndex;
      const stepDelta = direction === 'next' ? 1 : -1;
      state.targetScrollX = Math.round(state.targetScrollX + stepDelta);

      cardElements.forEach((el, idx) => {
        el.classList.toggle('extracted-slot', idx === wrappedIndex);
      });
      modeStatusText.textContent = `DOUDOU GALLERY · 第 ${wrappedIndex + 1} / ${total} 张 · 开开心心`;
      updateDotsUI();

      setTimeout(() => {
        populateSingleFrameContent(wrappedIndex);
        exquisiteFrameWrapper.classList.remove(outClass);
        exquisiteFrameWrapper.classList.add(inClass);

        setTimeout(() => {
          exquisiteFrameWrapper.classList.remove(inClass);
          state.isTransitioningSingle = false;
        }, 440);
      }, 300);
    }

    /******************************************************************
     * 7. TOUCH / POINTER GESTURES
     ******************************************************************/
    function bindStageGestures() {
      stripStagePrevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        stepStripBy(-1);
      });
      stripStageNextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        stepStripBy(1);
      });

      albumStageWrapper.addEventListener('pointerdown', (e) => {
        if (state.viewMode !== 'strip') return;
        if (e.target.closest('button')) return;

        if (state.introSweepActive) {
          triggerIntroSmoothBrake();
          state.dragMoved = true;
          setTimeout(() => { state.dragMoved = false; }, 120);
          return;
        }

        state.isDraggingStrip = true;
        state.dragMoved = false;
        state.pointerStartX = e.clientX;
        state.lastPointerX = e.clientX;
        state.lastPointerTime = performance.now();
        state.velocityX = 0;
      });

      window.addEventListener('pointermove', (e) => {
        if (state.isDraggingStrip && state.viewMode === 'strip') {
          const dx = e.clientX - state.lastPointerX;
          const totalDx = Math.abs(e.clientX - state.pointerStartX);
          if (totalDx > 6) {
            state.dragMoved = true;
          }

          const now = performance.now();
          const dt = Math.max(8, now - state.lastPointerTime);
          const cardSpacing = window.innerWidth < 640 ? 195 : 250;

          const deltaCards = -dx / cardSpacing;
          state.scrollX += deltaCards;
          state.targetScrollX = state.scrollX;
          state.velocityX = (deltaCards / dt) * 16.67;

          state.lastPointerX = e.clientX;
          state.lastPointerTime = now;
        }

        if (state.isDraggingSingle && state.viewMode === 'single' && !state.isTransitioningSingle) {
          state.singleDragDX = e.clientX - state.pointerStartX;
          state.singleDragDY = e.clientY - state.pointerStartY;

          const dx = state.singleDragDX;
          const dy = state.singleDragDY;

          if (dy > 15 && Math.abs(dy) > Math.abs(dx) * 1.15) {
            const progress = Math.min(1, dy / 220);
            const followY = -16 + dy * 0.68;
            const scale = 1 - progress * 0.32;
            const rotX = progress * 10;
            exquisiteFrameWrapper.style.transform = `translateY(${followY}px) scale(${scale}) rotateX(${rotX}deg)`;

            const stripY = 35 * (1 - progress * 0.65);
            const stripScale = 0.66 + progress * 0.22;
            albumStageWrapper.style.transform = `translateY(${stripY}vh) scale(${stripScale})`;
            albumStageWrapper.style.opacity = String(0.48 + progress * 0.35);
          } else {
            const tiltY = Math.max(-24, Math.min(24, dx * 0.08));
            const shiftX = dx * 0.38;
            const shiftZ = -Math.min(90, Math.abs(dx) * 0.35);
            exquisiteFrameWrapper.style.transform = `translateY(-16px) translateX(${shiftX}px) translateZ(${shiftZ}px) rotateY(${tiltY}deg)`;
          }
        }
      });

      window.addEventListener('pointerup', () => {
        if (state.isDraggingStrip) {
          state.isDraggingStrip = false;
          const projected = state.scrollX + state.velocityX * 11;
          const snapped = Math.round(projected);
          state.targetScrollX = snapped;
          state.activeIndex = wrapIndex(snapped, state.photos.length);
          updateCounterDisplay();
          setTimeout(() => { state.dragMoved = false; }, 60);
        }

        if (state.isDraggingSingle) {
          state.isDraggingSingle = false;
          const dx = state.singleDragDX;
          const dy = state.singleDragDY;

          exquisiteFrameWrapper.classList.remove('no-transition');

          if (dy > 60 && Math.abs(dy) > Math.abs(dx)) {
            exitSingleView(false);
          } else if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
            albumStageWrapper.style.transform = '';
            albumStageWrapper.style.opacity = '';
            if (dx < 0) {
              switchSinglePhotoTo(state.activeIndex + 1, 'next');
            } else {
              switchSinglePhotoTo(state.activeIndex - 1, 'prev');
            }
          } else {
            exquisiteFrameWrapper.style.transform = '';
            albumStageWrapper.style.transform = '';
            albumStageWrapper.style.opacity = '';
          }

          state.singleDragDX = 0;
          state.singleDragDY = 0;
        }
      });

      singleStageOverlay.addEventListener('pointerdown', (e) => {
        if (state.viewMode !== 'single' || state.isTransitioningSingle) return;
        if (e.target.closest('button')) return;

        state.isDraggingSingle = true;
        state.pointerStartX = e.clientX;
        state.pointerStartY = e.clientY;
        state.singleDragDX = 0;
        state.singleDragDY = 0;
        exquisiteFrameWrapper.classList.add('no-transition');
      });

      let lastWheelTime = 0;
      window.addEventListener('wheel', (e) => {
        const now = performance.now();
        if (state.viewMode === 'strip') {
          if (state.introSweepActive) {
            triggerIntroSmoothBrake();
            return;
          }
          const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
          state.targetScrollX = state.targetScrollX + delta * 0.0045;
          clearTimeout(window._wheelSnapTimer);
          window._wheelSnapTimer = setTimeout(() => {
            state.targetScrollX = Math.round(state.targetScrollX);
            state.activeIndex = wrapIndex(state.targetScrollX, state.photos.length);
            updateCounterDisplay();
          }, 160);
        } else if (state.viewMode === 'single') {
          if (now - lastWheelTime < 400) return;
          if (e.deltaY > 40 && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
            lastWheelTime = now;
            exitSingleView(false);
          } else if (Math.abs(e.deltaX) > 28) {
            lastWheelTime = now;
            if (e.deltaX > 0) switchSinglePhotoTo(state.activeIndex + 1, 'next');
            else switchSinglePhotoTo(state.activeIndex - 1, 'prev');
          }
        }
      }, { passive: true });

      window.addEventListener('keydown', (e) => {
        if (state.viewMode === 'single') {
          if (e.key === 'ArrowRight') switchSinglePhotoTo(state.activeIndex + 1, 'next');
          else if (e.key === 'ArrowLeft') switchSinglePhotoTo(state.activeIndex - 1, 'prev');
          else if (e.key === 'ArrowDown' || e.key === 'Escape') exitSingleView(false);
        } else {
          if (e.key === 'ArrowRight') stepStripBy(1);
          else if (e.key === 'ArrowLeft') stepStripBy(-1);
          else if (e.key === 'ArrowUp' || e.key === 'Enter') enterSingleView(wrapIndex(state.scrollX, state.photos.length));
        }
      });
    }

    /******************************************************************
     * 8. GRACEFUL 60FPS 3D COVERFLOW & OPENING SWEEP LOOP
     ******************************************************************/
    function animateLoop(now) {
      if (state.introSweepActive) {
        const elapsed = now - state.introStartTime;
        const t = Math.min(1, elapsed / state.introDuration);
        // 优美Quartic/Cubic丝滑减速曲线：开局轻快流光掠过全部32张卡片，末端如羽毛般轻柔停在中心
        const easeOut = 1 - Math.pow(1 - t, 3.2);
        const prevScroll = state.scrollX;
        state.scrollX = state.introStartScroll + (state.introEndScroll - state.introStartScroll) * easeOut;
        state.velocityX = state.scrollX - prevScroll;

        if (t >= 1) {
          state.introSweepActive = false;
          state.scrollX = state.introEndScroll;
          state.targetScrollX = state.introEndScroll;
          state.activeIndex = wrapIndex(state.introEndScroll, state.photos.length);
          state.velocityX = 0;
          updateCounterDisplay();
        }
      } else if (!state.isDraggingStrip) {
        const diff = state.targetScrollX - state.scrollX;
        const springFactor = state.introBraking ? 0.085 : 0.12;
        const step = diff * springFactor;
        state.velocityX = step;
        state.scrollX += step;
        if (Math.abs(diff) < 0.002) {
          state.scrollX = state.targetScrollX;
          state.introBraking = false;
        }
      }

      const isMobile = window.innerWidth < 640;
      const total = state.photos.length;
      const baseSpacing = isMobile ? 200 : 258;

      for (let i = 0; i < total; i++) {
        const card = cardElements[i];
        const offset = getCircularOffset(i, state.scrollX, total);
        const absOffset = Math.abs(offset);

        // 保持视野范围内卡片渲染，超出环形视野的背面卡片休眠
        if (absOffset > 4.5) {
          card.style.display = 'none';
          continue;
        } else {
          card.style.display = 'flex';
        }

        const sign = offset < 0 ? -1 : 1;
        const spreadX = offset * baseSpacing - sign * Math.max(0, absOffset - 1) * (isMobile ? 18 : 25);
        const depthZ = -Math.pow(absOffset, 1.2) * (isMobile ? 38 : 52);
        const archY = Math.pow(absOffset, 1.35) * 6;

        // 优美的呼吸悬浮感与随速度变化的 3D 侧倾角
        const floatY = Math.sin(now * 0.0022 + i * 1.05) * 5.5;
        const idleTiltZ = Math.cos(now * 0.0016 + i * 0.85) * 1.05;
        const coverflowRotY = Math.max(-28, Math.min(28, -offset * 12 - state.velocityX * 18));

        const scale = Math.max(0.76, 1 - absOffset * 0.048);
        const edgeFade = absOffset > 3.4 ? Math.max(0, 1 - (absOffset - 3.4) * 1.05) : 1;
        const opacity = Math.max(0.58, 1 - absOffset * 0.058) * edgeFade;

        card.style.transform = `translate3d(${spreadX.toFixed(1)}px, ${(archY + floatY).toFixed(1)}px, ${depthZ.toFixed(1)}px) rotateY(${coverflowRotY.toFixed(2)}deg) rotateZ(${idleTiltZ.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
        card.style.opacity = opacity.toFixed(3);
        card.style.zIndex = String(100 - Math.round(absOffset * 10));

        card.classList.toggle('is-center', absOffset < 0.45);
      }

      updateDotsUI();
      if (!state.introSweepActive && !state.isDraggingStrip) {
        updateCounterDisplay();
      }

      requestAnimationFrame(animateLoop);
    }

    /******************************************************************
     * 9. LIGHTWEIGHT STARLIGHT / WARM MOTES CANVAS
     ******************************************************************/
    function initAmbientCanvas() {
      const canvas = document.getElementById('ambientCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = (canvas.width = window.innerWidth);
      let h = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 24 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 1 + Math.random() * 2.1,
        vx: (Math.random() - 0.5) * 0.18,
        vy: -0.1 - Math.random() * 0.2,
        alpha: 0.15 + Math.random() * 0.32
      }));

      function drawParticles() {
        ctx.clearRect(0, 0, w, h);
        const isDark = document.body.classList.contains('dark-theme');
        for (const p of particles) {
          p.x += p.vx - state.velocityX * 1.2;
          p.y += p.vy;
          if (p.y < -10) p.y = h + 10;
          if (p.x < -10) p.x = w + 10;
          if (p.x > w + 10) p.x = -10;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = isDark
            ? `rgba(226, 196, 148, ${p.alpha * 1.25})`
            : `rgba(182, 149, 102, ${p.alpha})`;
          ctx.fill();
        }
        requestAnimationFrame(drawParticles);
      }
      drawParticles();
    }

    /******************************************************************
     * 10. MUSIC CONTROLLER
     ******************************************************************/
    function updateMusicUI(playing) {
      state.isPlayingMusic = playing;
      vinylDisc.classList.toggle('playing', playing);
      eqContainer.classList.toggle('playing', playing);
      musicStateLabel.textContent = playing ? '坂本龍一 · 正在播放' : '坂本龍一 · 已暂停';
    }

    function tryPlayMusic() {
      bgmAudio.volume = 0.78;
      const playPromise = bgmAudio.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            updateMusicUI(true);
            dismissWelcomeVeil();
          })
          .catch(() => {
            updateMusicUI(false);
          });
      }
    }

    function dismissWelcomeVeil() {
      if (!welcomeVeil || welcomeVeil.dataset.dismissed === 'true') return;
      welcomeVeil.dataset.dismissed = 'true';
      welcomeVeil.style.opacity = '0';
      welcomeVeil.style.pointerEvents = 'none';
      setTimeout(() => {
        welcomeVeil.style.display = 'none';
      }, 500);
      startOpeningAlbumSweep();
    }

    /******************************************************************
     * 11. WIRE ALL CONTROLS
     ******************************************************************/
    function wireControls() {
      welcomeVeil.addEventListener('click', () => {
        bgmAudio.play().then(() => updateMusicUI(true)).catch(() => {});
        dismissWelcomeVeil();
      });

      enterGalleryBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        bgmAudio.play().then(() => updateMusicUI(true)).catch(() => {});
        dismissWelcomeVeil();
      });

      musicToggleBtn.addEventListener('click', () => {
        if (bgmAudio.paused) {
          bgmAudio.play().then(() => updateMusicUI(true)).catch(() => {});
        } else {
          bgmAudio.pause();
          updateMusicUI(false);
        }
      });

      document.getElementById('replaySweepBtn').addEventListener('click', () => {
        startOpeningAlbumSweep();
      });

      document.getElementById('stripPrevBtn').addEventListener('click', () => {
        stepStripBy(-1);
      });
      document.getElementById('stripNextBtn').addEventListener('click', () => {
        stepStripBy(1);
      });
      document.getElementById('extractCenterBtn').addEventListener('click', () => {
        enterSingleView(wrapIndex(state.scrollX, state.photos.length));
      });

      document.getElementById('singlePrevBtn').addEventListener('click', () => {
        switchSinglePhotoTo(state.activeIndex - 1, 'prev');
      });
      document.getElementById('singleNextBtn').addEventListener('click', () => {
        switchSinglePhotoTo(state.activeIndex + 1, 'next');
      });
      document.getElementById('exitSingleBtn').addEventListener('click', () => {
        exitSingleView(false);
      });

      document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const isDark = document.body.classList.toggle('dark-theme');
        document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
      });
    }

    // Initialize Gallery
    window.addEventListener('DOMContentLoaded', () => {
      init32Photos();
      bindStageGestures();
      wireControls();
      initAmbientCanvas();
      requestAnimationFrame(animateLoop);
      tryPlayMusic();
    });
  </script>
</body>
</html>
