<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>豆豆 · 专属相册</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #F6F3EC;
      --bg-secondary: #EDE8DF;
      --text-main: #2A2522;
      --text-muted: #7D746B;
      --gold-accent: #B69566;
      --gold-light: #DFC9A6;
      --card-bg: #FCFBF9;
      --frame-outer: #382E27;
      --frame-mat: #FAF8F3;
      --shadow-ambient: rgba(42, 37, 34, 0.12);
    }

    body.dark-theme {
      --bg-primary: #171619;
      --bg-secondary: #222026;
      --text-main: #F2ECE1;
      --text-muted: #9E9589;
      --gold-accent: #C8A97E;
      --gold-light: #8A7250;
      --card-bg: #242228;
      --frame-outer: #2A231E;
      --frame-mat: #1E1D21;
      --shadow-ambient: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .font-serif-display {
      font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
    }

    /* Hardware accelerated smooth backdrop */
    .gallery-backdrop {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 252, 245, 0.75) 0%, transparent 68%),
        radial-gradient(circle at 85% 15%, rgba(182, 149, 102, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 15% 85%, rgba(182, 149, 102, 0.07) 0%, transparent 50%),
        var(--bg-primary);
      z-index: 0;
      will-change: transform;
    }

    body.dark-theme .gallery-backdrop {
      background:
        radial-gradient(circle at 50% 42%, rgba(56, 48, 42, 0.32) 0%, transparent 68%),
        radial-gradient(circle at 85% 15%, rgba(200, 169, 126, 0.07) 0%, transparent 45%),
        var(--bg-primary);
    }

    .gallery-wainscot {
      position: fixed;
      inset: 12px;
      border: 1px solid rgba(182, 149, 102, 0.22);
      pointer-events: none;
      z-index: 2;
    }
    .gallery-wainscot::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(182, 149, 102, 0.09);
    }

    /* Cute Animated Puppy Styles */
    @keyframes puppyBounce {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(2deg); }
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(22deg); }
    }
    @keyframes earFlopLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes earFlopRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes heartFloat {
      0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.75; }
      50% { transform: translateY(-4px) scale(1.12); opacity: 1; }
    }

    .puppy-avatar {
      animation: puppyBounce 2.2s ease-in-out infinite;
    }
    .puppy-tail {
      transform-origin: 48px 42px;
      animation: tailWag 0.45s ease-in-out infinite;
    }
    .puppy-ear-l {
      transform-origin: 20px 20px;
      animation: earFlopLeft 1.1s ease-in-out infinite;
    }
    .puppy-ear-r {
      transform-origin: 44px 20px;
      animation: earFlopRight 1.1s ease-in-out infinite;
    }
    .puppy-eyes {
      transform-origin: 32px 28px;
      animation: eyeBlink 3.6s infinite;
    }
    .puppy-heart {
      animation: heartFloat 1.8s ease-in-out infinite;
    }

    /* High-Performance 3D Stage for 32 Photos */
    .album-stage-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1600px;
      z-index: 10;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, opacity;
      touch-action: none;
    }

    .album-stage-wrapper.sunken {
      transform: translateY(35vh) scale(0.66);
      opacity: 0.48;
    }

    .album-track {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    /* Individual Album Card in the Strip (GPU Optimized) */
    .album-card {
      position: absolute;
      width: 270px;
      height: 346px;
      left: -135px;
      top: -173px;
      background: var(--card-bg);
      border-radius: 6px;
      padding: 14px 14px 16px 14px;
      box-shadow:
        0 16px 36px -10px var(--shadow-ambient),
        0 3px 10px -2px rgba(0, 0, 0, 0.05),
        inset 0 0 0 1px rgba(182, 149, 102, 0.3);
      cursor: pointer;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    @media (max-width: 640px) {
      .album-card {
        width: 226px;
        height: 298px;
        left: -113px;
        top: -149px;
        padding: 12px 12px 14px 12px;
      }
    }

    .album-card::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(182, 149, 102, 0.18);
      border-radius: 3px;
      pointer-events: none;
    }

    .album-card.is-center::before {
      border-color: rgba(182, 149, 102, 0.58);
    }

    .album-card.extracted-slot .card-inner-content {
      opacity: 0.14;
      transform: scale(0.92);
      filter: grayscale(0.8);
    }
    .album-card.extracted-slot::after {
      content: '正在上方展映';
      position: absolute;
      inset: 16px;
      border: 1.5px dashed rgba(182, 149, 102, 0.65);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--gold-accent);
      font-weight: 500;
      background: rgba(182, 149, 102, 0.05);
    }

    .card-inner-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Photo Corner Mounts */
    .photo-viewport {
      position: relative;
      width: 100%;
      height: 246px;
      overflow: hidden;
      background: #E5E0D5;
      border-radius: 2px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
    }
    @media (max-width: 640px) {
      .photo-viewport {
        height: 206px;
      }
    }

    .photo-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      loading: lazy;
      decoding: async;
    }

    .corner-mount {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--gold-accent);
      border-style: solid;
      z-index: 4;
      pointer-events: none;
      opacity: 0.85;
    }
    .corner-tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

    .invite-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(38, 32, 28, 0.8);
      color: #F7EFE2;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(212, 182, 132, 0.55);
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transform: translateY(4px);
      transition: all 0.25s ease;
      z-index: 5;
    }
    .album-card.is-center .invite-badge {
      opacity: 1;
      transform: translateY(0);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #E6C387;
    }

    /* Dot scroll container for 32 photos */
    .dots-scroll-box {
      max-width: min(42vw, 320px);
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 4px;
      scroll-behavior: smooth;
    }
    .dots-scroll-box::-webkit-scrollbar {
      display: none;
    }

    /* Floating Screen Navigation Arrows for Strip View */
    .strip-stage-nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: rgba(252, 251, 249, 0.94);
      border: 1px solid rgba(182, 149, 102, 0.45);
      color: #2A2522;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px -4px rgba(42, 37, 34, 0.16);
      z-index: 25;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    body.dark-theme .strip-stage-nav-btn {
      background: rgba(36, 34, 40, 0.94);
      color: #F2ECE1;
      border-color: rgba(200, 169, 126, 0.35);
      box-shadow: 0 8px 22px -4px rgba(0, 0, 0, 0.4);
    }
    .strip-stage-nav-btn:hover {
      background: var(--gold-accent);
      color: #FFFFFF;
      transform: translateY(-50%) scale(1.06);
    }
    .strip-stage-nav-btn.prev {
      left: 14px;
    }
    .strip-stage-nav-btn.next {
      right: 14px;
    }
    @media (max-width: 640px) {
      .strip-stage-nav-btn {
        width: 38px;
        height: 38px;
      }
      .strip-stage-nav-btn.prev { left: 8px; }
      .strip-stage-nav-btn.next { right: 8px; }
    }

    /* ============================================================
       EXTRACTED SINGLE PHOTO STAGE (精致相框单独查看层)
       ============================================================ */
    .single-stage-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      perspective: 1600px;
      transition: opacity 0.42s ease;
      touch-action: none;
    }

    .single-stage-overlay.active {
      pointer-events: auto;
      opacity: 1;
    }

    .single-backdrop-veil {
      position: absolute;
      inset: 0;
      background: rgba(246, 243, 236, 0.88);
      z-index: -1;
    }
    body.dark-theme .single-backdrop-veil {
      background: rgba(20, 19, 23, 0.92);
    }

    .exquisite-frame-wrapper {
      position: relative;
      transform-style: preserve-3d;
      transform: translateY(180px) scale(0.65);
      transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1),
                  opacity 0.45s ease;
      will-change: transform, opacity;
      max-width: 92vw;
      margin-bottom: 5vh;
      cursor: grab;
    }
    .exquisite-frame-wrapper:active {
      cursor: grabbing;
    }

    .single-stage-overlay.active .exquisite-frame-wrapper {
      transform: translateY(-14px) scale(1);
    }

    .exquisite-frame-wrapper.no-transition {
      transition: none !important;
    }

    /* Single Switch Animations */
    @keyframes singleSlideOutLeft {
      0% { transform: translateY(-14px) translateX(0) scale(1); opacity: 1; }
      100% { transform: translateY(-14px) translateX(-45%) scale(0.85); opacity: 0; }
    }
    @keyframes singleSlideInRight {
      0% { transform: translateY(-14px) translateX(45%) scale(0.85); opacity: 0; }
      100% { transform: translateY(-14px) translateX(0) scale(1); opacity: 1; }
    }
    @keyframes singleSlideOutRight {
      0% { transform: translateY(-14px) translateX(0) scale(1); opacity: 1; }
      100% { transform: translateY(-14px) translateX(45%) scale(0.85); opacity: 0; }
    }
    @keyframes singleSlideInLeft {
      0% { transform: translateY(-14px) translateX(-45%) scale(0.85); opacity: 0; }
      100% { transform: translateY(-14px) translateX(0) scale(1); opacity: 1; }
    }

    .exquisite-frame-wrapper.anim-out-left {
      animation: singleSlideOutLeft 0.26s ease-in forwards;
    }
    .exquisite-frame-wrapper.anim-in-right {
      animation: singleSlideInRight 0.35s ease-out forwards;
    }
    .exquisite-frame-wrapper.anim-out-right {
      animation: singleSlideOutRight 0.26s ease-in forwards;
    }
    .exquisite-frame-wrapper.anim-in-left {
      animation: singleSlideInLeft 0.35s ease-out forwards;
    }

    .museum-outer-frame {
      position: relative;
      background: linear-gradient(145deg, #43372E 0%, #29211B 50%, #3B3028 100%);
      padding: 12px;
      border-radius: 8px;
      box-shadow:
        0 28px 60px -12px rgba(28, 22, 18, 0.38),
        0 8px 20px -4px rgba(28, 22, 18, 0.22),
        inset 0 0 0 2px #8B6F47;
    }

    .museum-mat-board {
      position: relative;
      background: var(--frame-mat);
      padding: 22px 24px 18px 24px;
      border-radius: 3px;
      border: 2px solid #C6A677;
    }

    @media (max-width: 640px) {
      .museum-outer-frame { padding: 8px; }
      .museum-mat-board { padding: 14px 14px 12px 14px; }
    }

    .museum-image-bevel {
      position: relative;
      width: min(540px, 80vw);
      height: min(380px, 50vh);
      padding: 4px;
      background: linear-gradient(135deg, #D5BC94 0%, #9E7F53 50%, #E7D4B5 100%);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .museum-image-bevel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #E8E3D9;
      pointer-events: none;
    }

    .frame-filigree {
      position: absolute;
      width: 26px;
      height: 26px;
      pointer-events: none;
      z-index: 5;
      color: #D6B785;
      opacity: 0.9;
    }
    .filigree-tl { top: 6px; left: 6px; }
    .filigree-tr { top: 6px; right: 6px; transform: scaleX(-1); }
    .filigree-bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
    .filigree-br { bottom: 6px; right: 6px; transform: scale(-1, -1); }

    .museum-plaque {
      margin-top: 14px;
      padding: 8px 18px;
      background: rgba(198, 166, 119, 0.16);
      border-top: 1px solid rgba(182, 149, 102, 0.42);
      border-bottom: 1px solid rgba(182, 149, 102, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Vinyl Disc */
    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .vinyl-disc {
      animation: spinVinyl 6s linear infinite;
      animation-play-state: paused;
    }
    .vinyl-disc.playing {
      animation-play-state: running;
    }

    /* Equalizer */
    @keyframes eqBar1 { 0%, 100% { height: 4px; } 50% { height: 14px; } }
    @keyframes eqBar2 { 0%, 100% { height: 13px; } 40% { height: 4px; } 80% { height: 15px; } }
    @keyframes eqBar3 { 0%, 100% { height: 6px; } 60% { height: 16px; } }
    .eq-bar {
      width: 2.5px;
      background: var(--gold-accent);
      border-radius: 2px;
      height: 4px;
    }
    .playing .eq-bar-1 { animation: eqBar1 0.8s infinite ease-in-out; }
    .playing .eq-bar-2 { animation: eqBar2 0.7s infinite ease-in-out; }
    .playing .eq-bar-3 { animation: eqBar3 0.9s infinite ease-in-out; }
    .playing .eq-bar-4 { animation: eqBar1 0.65s infinite ease-in-out 0.2s; }

    @keyframes swipeDownHint {
      0%, 100% { transform: translateY(0); opacity: 0.8; }
      50% { transform: translateY(4px); opacity: 1; }
    }
    .swipe-down-pill {
      animation: swipeDownHint 2.2s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <!-- Background & Dust Canvas -->
  <div class="gallery-backdrop"></div>
  <canvas id="ambientCanvas" class="fixed inset-0 pointer-events-none z-[1]"></canvas>
  <div class="gallery-wainscot"></div>

  <!-- Background Audio: Merry Christmas Mr. Lawrence - 坂本龍一 (preload="none" 杜绝卡顿与抢网) -->
  <audio id="bgmAudio" src="./music/bgm.mp3" loop preload="none"></audio>

  <!-- ============================================================
       TOP NAVIGATION & MUSIC CONTROLLER BAR
       ============================================================ -->
  <header class="fixed top-0 left-0 right-0 z-40 px-5 py-3.5 flex items-center justify-between gap-3 pointer-events-none">
    <div class="flex items-center gap-2.5 pointer-events-auto">
      <div class="w-10 h-10 rounded-full border border-[#B69566]/45 flex items-center justify-center bg-[#FCFBF9]/95 shadow-sm overflow-visible relative">
        <svg class="puppy-avatar w-8 h-8" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path class="puppy-tail" d="M47 43C53 39 56 33 54 29C52 26 48 31 46 38" stroke="#C89B6E" stroke-width="4.5" stroke-linecap="round"/>
          <ellipse cx="34" cy="45" rx="14" ry="10" fill="#F3DEC3" stroke="#8C6239" stroke-width="2"/>
          <path d="M23 38C28 41 36 41 41 38" stroke="#E05A47" stroke-width="3" stroke-linecap="round"/>
          <circle cx="32" cy="41" r="2.8" fill="#F4C542" stroke="#8C6239" stroke-width="1.2"/>
          <g class="puppy-ear-l">
            <ellipse cx="17" cy="24" rx="5.5" ry="10.5" transform="rotate(18 17 24)" fill="#C89B6E" stroke="#8C6239" stroke-width="2"/>
          </g>
          <g class="puppy-ear-r">
            <ellipse cx="47" cy="24" rx="5.5" ry="10.5" transform="rotate(-18 47 24)" fill="#C89B6E" stroke="#8C6239" stroke-width="2"/>
          </g>
          <circle cx="32" cy="25" r="14" fill="#FFF5E6" stroke="#8C6239" stroke-width="2"/>
          <path d="M26 12C29 16 35 16 38 12" fill="#E3B98B"/>
          <g class="puppy-eyes">
            <circle cx="26.5" cy="24.5" r="2.3" fill="#2A211B"/>
            <circle cx="25.8" cy="23.8" r="0.8" fill="#FFFFFF"/>
            <circle cx="37.5" cy="24.5" r="2.3" fill="#2A211B"/>
            <circle cx="36.8" cy="23.8" r="0.8" fill="#FFFFFF"/>
          </g>
          <ellipse cx="22.5" cy="27.8" rx="2.6" ry="1.5" fill="#F4978E" opacity="0.65"/>
          <ellipse cx="41.5" cy="27.8" rx="2.6" ry="1.5" fill="#F4978E" opacity="0.65"/>
          <ellipse cx="32" cy="27.2" rx="2.5" ry="1.8" fill="#4A3525"/>
          <path d="M30 31.2C30 33.4 34 33.4 34 31.2" fill="#F27A7D" stroke="#8C6239" stroke-width="1.3"/>
          <path d="M28.5 29.8Q32 32.2 35.5 29.8" stroke="#8C6239" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <circle cx="25" cy="53" r="3.5" fill="#FFF5E6" stroke="#8C6239" stroke-width="1.8"/>
          <circle cx="39" cy="53" r="3.5" fill="#FFF5E6" stroke="#8C6239" stroke-width="1.8"/>
          <path class="puppy-heart" d="M51 12C51 10.5 49.5 9.5 48.3 10.6C47.1 9.5 45.6 10.5 45.6 12C45.6 13.8 48.3 15.6 48.3 15.6C48.3 15.6 51 13.8 51 12Z" fill="#E86F68"/>
        </svg>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="font-serif-display text-xl sm:text-2xl font-bold tracking-wider leading-tight">豆豆</h1>
          <span class="text-xs px-2 py-0.5 rounded-full bg-[#B69566]/15 text-[#B69566] font-medium">开开心心 🐾</span>
        </div>
        <p id="modeStatusText" class="text-[11px] tracking-widest uppercase text-[#7D746B]">DOUDOU GALLERY · 32张照片全景展映</p>
      </div>
    </div>

    <!-- Right Action Controls -->
    <div class="flex items-center gap-2 sm:gap-2.5 pointer-events-auto flex-wrap justify-end">
      <!-- Replay Opening Sweep Button -->
      <button id="replaySweepBtn" type="button" class="px-3 py-1.5 rounded-full text-xs font-medium border border-[#B69566]/40 bg-[#FCFBF9]/90 text-[#2A2522] hover:border-[#B69566] hover:bg-[#B69566]/10 transition flex items-center gap-1.5 shadow-sm" title="重播2秒入场循环掠过动画">
        <span>✨</span>
        <span class="hidden sm:inline">重播入场掠过</span>
      </button>

      <!-- Theme Toggle (Warm Ivory / Dark Gallery) -->
      <button id="themeToggleBtn" type="button" class="w-8 h-8 rounded-full border border-[#B69566]/40 bg-[#FCFBF9]/90 text-[#2A2522] hover:border-[#B69566] transition flex items-center justify-center shadow-sm" title="切换浅色画廊 / 夜色胶片主题">
        <span id="themeIcon">🌙</span>

  <!-- ============================================================
       HIGH PERFORMANCE JAVASCRIPT ENGINE (OPTIMIZED FOR 32 PHOTOS)
       ============================================================ -->
  <script>
    /**
     * 【32 张照片高速稳定配置】
     * 1. 精确加载 32 张照片，零多余网络探测，手机/平板瞬间秒开！
     * 2. 音频按需流式缓冲（preload: none），绝不抢占移动端下行带宽。
     * 3. 动态视距休眠（超出视野的卡片暂停GPU矩阵计算，保留前后饱满视野），稳定 60 FPS 满帧丝滑。
     */
    const USER_CONFIG = {
      photoFolder: './photos/',
      musicFile: './music/bgm.mp3',
      photoCount: 32,           // ★ 精确指定 32 张照片，彻底杜绝盲测阻塞！
      supportedExts: ['.jpg', '.JPG', '.png', '.PNG', '.jpeg', '.webp']
    };

    const BUILTIN_PREVIEW_PHOTOS = [];

    // State Management
    const state = {
      photos: [],               // Exactly 32 photos
      viewMode: 'strip',        // 'strip' | 'single'
      activeIndex: 0,           // 0 .. 31
      scrollX: 0,               // Continuous circular scroll index
      targetScrollX: 0,
      velocityX: 0,
      isDraggingStrip: false,
      dragMoved: false,
      pointerStartX: 0,
      pointerStartY: 0,
      lastPointerX: 0,
      lastPointerTime: 0,

      // 2.0s fast-to-slow sweep
      introSweepActive: false,
      introBraking: false,
      introStartTime: 0,
      introDuration: 2000,
      introStartScroll: 0,
      introEndScroll: 0,

      // Single view gesture
      isDraggingSingle: false,
      singleDragDX: 0,
      singleDragDY: 0,
      isTransitioningSingle: false,

      // Audio state
      isPlayingMusic: false
    };

    // DOM References
    const albumStageWrapper = document.getElementById('albumStageWrapper');
    const albumTrack = document.getElementById('albumTrack');
    const stripStagePrevBtn = document.getElementById('stripStagePrevBtn');
    const stripStageNextBtn = document.getElementById('stripStageNextBtn');
    const singleStageOverlay = document.getElementById('singleStageOverlay');
    const exquisiteFrameWrapper = document.getElementById('exquisiteFrameWrapper');
    const singleFramedImg = document.getElementById('singleFramedImg');
    const singleFramedTitle = document.getElementById('singleFramedTitle');
    const statusToast = document.getElementById('statusToast');
    const counterText = document.getElementById('counterText');
    const modeStatusText = document.getElementById('modeStatusText');
    const dotIndicators = document.getElementById('dotIndicators');
    const stripFooterBar = document.getElementById('stripFooterBar');

    const bgmAudio = document.getElementById('bgmAudio');
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const vinylDisc = document.getElementById('vinylDisc');
    const eqContainer = document.getElementById('eqContainer');
    const musicStateLabel = document.getElementById('musicStateLabel');
    const welcomeVeil = document.getElementById('welcomeVeil');
    const enterGalleryBtn = document.getElementById('enterGalleryBtn');

    let cardElements = [];

    // Helper: Wrap index into [0, total - 1]
    function wrapIndex(idx, total) {
      if (total <= 0) return 0;
      return ((Math.round(idx) % total) + total) % total;
    }

    // Helper: Shortest circular offset
    function getCircularOffset(i, scrollX, total) {
      if (total <= 1) return 0;
      let diff = (i - scrollX) % total;
      if (diff > total / 2) diff -= total;
      if (diff < -total / 2) diff += total;
      return diff;
    }

    // Helper: Move targetScrollX to nearest equivalent position matching targetIdx
    function getNearestTargetScroll(currentScroll, targetIdx, total) {
      if (total <= 1) return 0;
      const diff = getCircularOffset(targetIdx, currentScroll, total);
      return Math.round(currentScroll + diff);
    }

    /******************************************************************
     * 1. INSTANT ZERO-LATENCY PHOTO INITIALIZATION (0毫秒即刻挂载32张)
     ******************************************************************/
    function init32Photos() {
      // 1. 如果是在内置预览环境（Canvas），使用内嵌示范照片
      if (Array.isArray(BUILTIN_PREVIEW_PHOTOS) && BUILTIN_PREVIEW_PHOTOS.length > 0) {
        state.photos = Array.from({ length: 32 }, (_, idx) => {
          const previewItem = BUILTIN_PREVIEW_PHOTOS[idx % BUILTIN_PREVIEW_PHOTOS.length];
          return {
            id: idx,
            num: idx + 1,
            resolvedSrc: previewItem.url,
            caption: '开开心心'
          };
        });
      } else {
        // 2. 真实 GitHub / 本地环境：直接按 1..32 构建，0 毫秒完成！
        const folder = USER_CONFIG.photoFolder;
        state.photos = Array.from({ length: 32 }, (_, idx) => ({
          id: idx,
          num: idx + 1,
          resolvedSrc: `${folder}${idx + 1}.jpg`,
          caption: '开开心心'
        }));
      }

      buildAlbumDOM();
      updateCounterDisplay();

      // 如果有任何照片不是 .jpg 格式（例如是 .png），后台静默自动探测并修正图片地址，不阻碍主界面
      if (!Array.isArray(BUILTIN_PREVIEW_PHOTOS) || BUILTIN_PREVIEW_PHOTOS.length === 0) {
        verifyNonJpgExtensions();
      }
    }

    // 静默容错探测：只有当 1.jpg 加载失败时才检测 .png / .jpeg 等，绝不无谓发起数百次请求
    function verifyNonJpgExtensions() {
      state.photos.forEach((photo, idx) => {
        const testImg = new Image();
        testImg.onerror = () => {
          // 当前 .jpg 失败，尝试其他格式
          probeOtherExtensions(photo.num, idx);
        };
        testImg.src = photo.resolvedSrc;
      });
    }

    function probeOtherExtensions(num, idx) {
      const folder = USER_CONFIG.photoFolder;
      const exts = ['.JPG', '.png', '.PNG', '.jpeg', '.JPEG', '.webp'];
      for (const ext of exts) {
        const candidate = `${folder}${num}${ext}`;
        const probeImg = new Image();
        probeImg.onload = () => {
          if (state.photos[idx]) {
            state.photos[idx].resolvedSrc = candidate;
            const targetCard = cardElements[idx];
            if (targetCard) {
              const img = targetCard.querySelector('img');
              if (img) img.src = candidate;
            }
          }
        };
        probeImg.src = candidate;
      }
    }

    /******************************************************************
     * 2. RENDER 32 ALBUM CARDS & DOTS
     ******************************************************************/
    function buildAlbumDOM() {
      albumTrack.innerHTML = '';
      dotIndicators.innerHTML = '';
      cardElements = [];

      const total = state.photos.length;

      for (let idx = 0; idx < total; idx++) {
        const photo = state.photos[idx];

        const card = document.createElement('article');
        card.className = 'album-card';
        card.dataset.index = String(idx);

        card.innerHTML = `
          <div class="card-inner-content">
            <div class="photo-viewport">
              <span class="corner-mount corner-tl"></span>
              <span class="corner-mount corner-tr"></span>
              <span class="corner-mount corner-bl"></span>
              <span class="corner-mount corner-br"></span>
              <img src="${photo.resolvedSrc}" alt="开开心心" loading="lazy" decoding="async" draggable="false" />
              <div class="invite-badge">
                <span class="pulse-dot"></span>
                <span>查看装裱</span>
              </div>
            </div>

            <div class="pt-2 flex items-center justify-center gap-2">
              <span class="text-[#B69566] text-xs">✦</span>
              <h3 class="font-serif-display text-base font-semibold tracking-[0.22em] text-[#2A2522] dark:text-[#F2ECE1]">开开心心</h3>
              <span class="text-[#B69566] text-xs">✦</span>
            </div>
          </div>
        `;

        card.addEventListener('click', (e) => {
          e.stopPropagation();
          handleCardClick(idx);
        });

        albumTrack.appendChild(card);
        cardElements.push(card);

        // 32 个微型指示圆点
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'h-1.5 rounded-full transition-all duration-300 bg-[#B69566]/35 hover:bg-[#B69566] w-1.5 flex-shrink-0';
        dot.title = `第 ${idx + 1} 张 · 开开心心`;
        dot.addEventListener('click', () => {
          if (state.introSweepActive) {
            triggerIntroSmoothBrake(idx);
          } else if (state.viewMode === 'strip') {
            focusCardToRealIndex(idx);
          } else {
            switchSinglePhotoTo(idx, idx > state.activeIndex ? 'next' : 'prev');
          }
        });
        dotIndicators.appendChild(dot);
      }

      if (singleFramedImg && !singleFramedImg.getAttribute('src') && state.photos[0]) {
        singleFramedImg.src = state.photos[0].resolvedSrc;
      }

      updateDotsUI();
      updateCounterDisplay();
    }

    function updateCounterDisplay() {
      if (!counterText) return;
      const total = state.photos.length;
      const current = wrapIndex(state.scrollX, total) + 1;
      counterText.textContent = `第 ${current} / ${total} 张 · 32张照片全景展映 🐾`;
    }

    function updateDotsUI() {
      const dots = dotIndicators.children;
      const total = state.photos.length;
      if (total === 0) return;
      const centerRealIdx = wrapIndex(state.scrollX, total);
      const highlightIdx = state.viewMode === 'single' ? state.activeIndex : centerRealIdx;

      for (let i = 0; i < dots.length; i++) {
        if (i === highlightIdx) {
          dots[i].className = 'h-1.5 rounded-full transition-all duration-300 bg-[#B69566] w-5 flex-shrink-0';
          if (dots[i].scrollIntoView) {
            dots[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          }
        } else {
          dots[i].className = 'h-1.5 rounded-full transition-all duration-300 bg-[#B69566]/30 hover:bg-[#B69566]/60 w-1.5 flex-shrink-0';
        }
      }
    }

    function showToast(msg) {
      if (!statusToast) return;
      if (counterText) counterText.textContent = msg;
    }

    /******************************************************************
     * 3. 2.0-SECOND FAST-TO-SLOW CIRCULAR SWEEP (32张环形由快到慢停在中心)
     ******************************************************************/
    function startOpeningAlbumSweep() {
      if (state.viewMode === 'single') {
        exitSingleView(true);
      }

      const total = state.photos.length;
      // 32 张照片的黄金正中心：第 16 张（索引 15），左右两边各有 16 张照片对称环绕，视觉最饱满！
      const goldenCenterIndex = 15;

      // 2.0 秒内从负方向掠过一整圈 32 张照片并在 2.0 秒准时由快到慢柔和停在正中央
      state.introStartScroll = -(total - goldenCenterIndex);
      state.introEndScroll = goldenCenterIndex;
      state.scrollX = state.introStartScroll;
      state.targetScrollX = state.introEndScroll;
      state.activeIndex = goldenCenterIndex;
      state.velocityX = 0;

      state.introSweepActive = true;
      state.introBraking = false;
      state.introDuration = 2000; // 严格 2.0 秒
      state.introStartTime = performance.now();

      showToast(`✨ 32张照片流光掠过中 · 2秒后稳稳停在黄金中心位`);
    }

    function triggerIntroSmoothBrake(preferredRealIndex = null) {
      if (!state.introSweepActive || state.introBraking) return;
      state.introBraking = true;
      state.introSweepActive = false;

      const total = state.photos.length;
      let landingScroll;
      if (preferredRealIndex !== null) {
        landingScroll = getNearestTargetScroll(state.scrollX, preferredRealIndex, total);
      } else {
        landingScroll = Math.round(state.scrollX + 0.35);
      }

      state.targetScrollX = landingScroll;
      state.activeIndex = wrapIndex(landingScroll, total);
      updateCounterDisplay();
    }

    function stepStripBy(deltaSteps) {
      state.introSweepActive = false;
      state.introBraking = false;
      state.velocityX = 0;
      state.targetScrollX = Math.round(state.targetScrollX + deltaSteps);
      state.activeIndex = wrapIndex(state.targetScrollX, state.photos.length);
      updateCounterDisplay();
    }

    function focusCardToRealIndex(realIndex) {
      const total = state.photos.length;
      state.introSweepActive = false;
      state.introBraking = false;
      state.velocityX = 0;
      const diff = getCircularOffset(realIndex, state.targetScrollX, total);
      state.targetScrollX = Math.round(state.targetScrollX + diff);
      state.activeIndex = wrapIndex(state.targetScrollX, total);
      updateCounterDisplay();
    }

    /******************************************************************
     * 4. CARD CLICK -> EXTRACT PHOTO UPWARD INTO MUSEUM FRAME
     ******************************************************************/
    function handleCardClick(realIndex) {
      if (state.dragMoved) return;

      if (state.introSweepActive) {
        triggerIntroSmoothBrake(realIndex);
        return;
      }

      if (state.viewMode === 'single') {
        if (realIndex !== state.activeIndex) {
          const diff = getCircularOffset(realIndex, state.activeIndex, state.photos.length);
          switchSinglePhotoTo(realIndex, diff >= 0 ? 'next' : 'prev');
        }
        return;
      }

      const total = state.photos.length;
      const offset = getCircularOffset(realIndex, state.scrollX, total);
      state.targetScrollX = Math.round(state.scrollX + offset);
      enterSingleView(realIndex);
    }

    function enterSingleView(realIndex) {
      const total = state.photos.length;
      const clamped = wrapIndex(realIndex, total);
      state.activeIndex = clamped;
      state.velocityX = 0;
      state.viewMode = 'single';

      populateSingleFrameContent(clamped);

      cardElements.forEach((el, idx) => {
        el.classList.toggle('extracted-slot', idx === clamped);
      });

      albumStageWrapper.classList.add('sunken');
      singleStageOverlay.classList.add('active');
      singleStageOverlay.setAttribute('aria-hidden', 'false');
      stripFooterBar.style.opacity = '0';
      stripFooterBar.style.pointerEvents = 'none';

      modeStatusText.textContent = `DOUDOU GALLERY · 第 ${clamped + 1} / 32 张 · 开开心心`;
      updateDotsUI();
    }

    function populateSingleFrameContent(index) {
      const item = state.photos[index];
      if (!item) return;
      singleFramedImg.src = item.resolvedSrc;
      singleFramedImg.alt = '开开心心';
      singleFramedTitle.textContent = '开开心心';
    }

    /******************************************************************
     * 5. SWIPE DOWN OR CLICK TO RETURN TO ALBUM STRIP CENTER
     ******************************************************************/
    function exitSingleView(instant = false) {
      if (state.viewMode !== 'single') return;
      state.viewMode = 'strip';

      const total = state.photos.length;
      const diff = getCircularOffset(state.activeIndex, state.scrollX, total);
      state.targetScrollX = Math.round(state.scrollX + diff);
      if (instant) {
        state.scrollX = state.targetScrollX;
      }

      exquisiteFrameWrapper.classList.remove('no-transition', 'anim-out-left', 'anim-in-right', 'anim-out-right', 'anim-in-left');
      exquisiteFrameWrapper.style.transform = '';
      exquisiteFrameWrapper.style.opacity = '';
      albumStageWrapper.style.transform = '';
      albumStageWrapper.style.opacity = '';

      albumStageWrapper.classList.remove('sunken');
      singleStageOverlay.classList.remove('active');
      singleStageOverlay.setAttribute('aria-hidden', 'true');

      cardElements.forEach((el) => el.classList.remove('extracted-slot'));

      stripFooterBar.style.opacity = '1';
      stripFooterBar.style.pointerEvents = 'none';

      modeStatusText.textContent = `DOUDOU GALLERY · 32张照片全景展映`;
      updateDotsUI();
      updateCounterDisplay();
    }

    /******************************************************************
     * 6. SWITCH PHOTO IN SINGLE VIEW
     ******************************************************************/
    function switchSinglePhotoTo(newIndex, direction = 'next') {
      if (state.isTransitioningSingle || state.photos.length <= 1) return;
      const total = state.photos.length;
      const wrappedIndex = wrapIndex(newIndex, total);
      if (wrappedIndex === state.activeIndex) return;

      state.isTransitioningSingle = true;
      exquisiteFrameWrapper.classList.remove('no-transition', 'anim-out-left', 'anim-in-right', 'anim-out-right', 'anim-in-left');
      exquisiteFrameWrapper.style.transform = '';

      const outClass = direction === 'next' ? 'anim-out-left' : 'anim-out-right';
      const inClass = direction === 'next' ? 'anim-in-right' : 'anim-in-left';

      exquisiteFrameWrapper.classList.add(outClass);

      state.activeIndex = wrappedIndex;
      const stepDelta = direction === 'next' ? 1 : -1;
      state.targetScrollX = Math.round(state.targetScrollX + stepDelta);

      cardElements.forEach((el, idx) => {
        el.classList.toggle('extracted-slot', idx === wrappedIndex);
      });
      modeStatusText.textContent = `DOUDOU GALLERY · 第 ${wrappedIndex + 1} / 32 张 · 开开心心`;
      updateDotsUI();

      setTimeout(() => {
        populateSingleFrameContent(wrappedIndex);
        exquisiteFrameWrapper.classList.remove(outClass);
        exquisiteFrameWrapper.classList.add(inClass);

        setTimeout(() => {
          exquisiteFrameWrapper.classList.remove(inClass);
          state.isTransitioningSingle = false;
        }, 360);
      }, 260);
    }

    /******************************************************************
     * 7. TOUCH / POINTER GESTURES
     ******************************************************************/
    function bindStageGestures() {
      stripStagePrevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        stepStripBy(-1);
      });
      stripStageNextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        stepStripBy(1);
      });

      albumStageWrapper.addEventListener('pointerdown', (e) => {
        if (state.viewMode !== 'strip') return;
        if (e.target.closest('button')) return;

        if (state.introSweepActive) {
          triggerIntroSmoothBrake();
          state.dragMoved = true;
          setTimeout(() => { state.dragMoved = false; }, 120);
          return;
        }

        state.isDraggingStrip = true;
        state.dragMoved = false;
        state.pointerStartX = e.clientX;
        state.lastPointerX = e.clientX;
        state.lastPointerTime = performance.now();
        state.velocityX = 0;
      });

      window.addEventListener('pointermove', (e) => {
        if (state.isDraggingStrip && state.viewMode === 'strip') {
          const dx = e.clientX - state.lastPointerX;
          const totalDx = Math.abs(e.clientX - state.pointerStartX);
          if (totalDx > 6) {
            state.dragMoved = true;
          }

          const now = performance.now();
          const dt = Math.max(8, now - state.lastPointerTime);
          const cardSpacing = window.innerWidth < 640 ? 190 : 240;

          const deltaCards = -dx / cardSpacing;
          state.scrollX += deltaCards;
          state.targetScrollX = state.scrollX;
          state.velocityX = (deltaCards / dt) * 16.67;

          state.lastPointerX = e.clientX;
          state.lastPointerTime = now;
        }

        if (state.isDraggingSingle && state.viewMode === 'single' && !state.isTransitioningSingle) {
          state.singleDragDX = e.clientX - state.pointerStartX;
          state.singleDragDY = e.clientY - state.pointerStartY;

          const dx = state.singleDragDX;
          const dy = state.singleDragDY;

          if (dy > 15 && Math.abs(dy) > Math.abs(dx) * 1.15) {
            const progress = Math.min(1, dy / 200);
            const followY = -14 + dy * 0.65;
            const scale = 1 - progress * 0.3;
            exquisiteFrameWrapper.style.transform = `translateY(${followY}px) scale(${scale})`;

            const stripY = 35 * (1 - progress * 0.65);
            const stripScale = 0.66 + progress * 0.22;
            albumStageWrapper.style.transform = `translateY(${stripY}vh) scale(${stripScale})`;
            albumStageWrapper.style.opacity = String(0.48 + progress * 0.35);
          } else {
            const shiftX = dx * 0.38;
            exquisiteFrameWrapper.style.transform = `translateY(-14px) translateX(${shiftX}px)`;
          }
        }
      });

      window.addEventListener('pointerup', () => {
        if (state.isDraggingStrip) {
          state.isDraggingStrip = false;
          const projected = state.scrollX + state.velocityX * 10;
          const snapped = Math.round(projected);
          state.targetScrollX = snapped;
          state.activeIndex = wrapIndex(snapped, state.photos.length);
          updateCounterDisplay();
          setTimeout(() => { state.dragMoved = false; }, 60);
        }

        if (state.isDraggingSingle) {
          state.isDraggingSingle = false;
          const dx = state.singleDragDX;
          const dy = state.singleDragDY;

          exquisiteFrameWrapper.classList.remove('no-transition');

          if (dy > 60 && Math.abs(dy) > Math.abs(dx)) {
            exitSingleView(false);
          } else if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
            albumStageWrapper.style.transform = '';
            albumStageWrapper.style.opacity = '';
            if (dx < 0) {
              switchSinglePhotoTo(state.activeIndex + 1, 'next');
            } else {
              switchSinglePhotoTo(state.activeIndex - 1, 'prev');
            }
          } else {
            exquisiteFrameWrapper.style.transform = '';
            albumStageWrapper.style.transform = '';
            albumStageWrapper.style.opacity = '';
          }

          state.singleDragDX = 0;
          state.singleDragDY = 0;
        }
      });

      singleStageOverlay.addEventListener('pointerdown', (e) => {
        if (state.viewMode !== 'single' || state.isTransitioningSingle) return;
        if (e.target.closest('button')) return;

        state.isDraggingSingle = true;
        state.pointerStartX = e.clientX;
        state.pointerStartY = e.clientY;
        state.singleDragDX = 0;
        state.singleDragDY = 0;
        exquisiteFrameWrapper.classList.add('no-transition');
      });

      let lastWheelTime = 0;
      window.addEventListener('wheel', (e) => {
        const now = performance.now();
        if (state.viewMode === 'strip') {
          if (state.introSweepActive) {
            triggerIntroSmoothBrake();
            return;
          }
          const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
          state.targetScrollX = state.targetScrollX + delta * 0.0045;
          clearTimeout(window._wheelSnapTimer);
          window._wheelSnapTimer = setTimeout(() => {
            state.targetScrollX = Math.round(state.targetScrollX);
            state.activeIndex = wrapIndex(state.targetScrollX, state.photos.length);
            updateCounterDisplay();
          }, 160);
        } else if (state.viewMode === 'single') {
          if (now - lastWheelTime < 400) return;
          if (e.deltaY > 40 && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
            lastWheelTime = now;
            exitSingleView(false);
          } else if (Math.abs(e.deltaX) > 28) {
            lastWheelTime = now;
            if (e.deltaX > 0) switchSinglePhotoTo(state.activeIndex + 1, 'next');
            else switchSinglePhotoTo(state.activeIndex - 1, 'prev');
          }
        }
      }, { passive: true });

      window.addEventListener('keydown', (e) => {
        if (state.viewMode === 'single') {
          if (e.key === 'ArrowRight') switchSinglePhotoTo(state.activeIndex + 1, 'next');
          else if (e.key === 'ArrowLeft') switchSinglePhotoTo(state.activeIndex - 1, 'prev');
          else if (e.key === 'ArrowDown' || e.key === 'Escape') exitSingleView(false);
        } else {
          if (e.key === 'ArrowRight') stepStripBy(1);
          else if (e.key === 'ArrowLeft') stepStripBy(-1);
          else if (e.key === 'ArrowUp' || e.key === 'Enter') enterSingleView(wrapIndex(state.scrollX, state.photos.length));
        }
      });
    }

    /******************************************************************
     * 8. ULTRA SMOOTH 60FPS LOOP (DYNAMIC VIEWPORT OPTIMIZATION)
     * 保持视野内及前后共 9 张卡片活跃，远端卡片休眠，手机/平板稳定 60 FPS！
     ******************************************************************/
    function animateLoop(now) {
      if (state.introSweepActive) {
        const elapsed = now - state.introStartTime;
        const t = Math.min(1, elapsed / state.introDuration);
        const easeOut = 1 - Math.pow(1 - t, 3.0);
        const prevScroll = state.scrollX;
        state.scrollX = state.introStartScroll + (state.introEndScroll - state.introStartScroll) * easeOut;
        state.velocityX = state.scrollX - prevScroll;

        if (t >= 1) {
          state.introSweepActive = false;
          state.scrollX = state.introEndScroll;
          state.targetScrollX = state.introEndScroll;
          state.activeIndex = wrapIndex(state.introEndScroll, state.photos.length);
          state.velocityX = 0;
          updateCounterDisplay();
        }
      } else if (!state.isDraggingStrip) {
        const diff = state.targetScrollX - state.scrollX;
        const springFactor = state.introBraking ? 0.09 : 0.14;
        const step = diff * springFactor;
        state.velocityX = step;
        state.scrollX += step;
        if (Math.abs(diff) < 0.002) {
          state.scrollX = state.targetScrollX;
          state.introBraking = false;
        }
      }

      const isMobile = window.innerWidth < 640;
      const total = state.photos.length;
      const baseSpacing = isMobile ? 185 : 235;

      for (let i = 0; i < total; i++) {
        const card = cardElements[i];
        const offset = getCircularOffset(i, state.scrollX, total);
        const absOffset = Math.abs(offset);

        // ★ 核心视距优化：超出视野较远的卡片设为休眠，不消耗移动端 GPU 显存
        if (absOffset > 4.2) {
          card.style.display = 'none';
          continue;
        } else {
          card.style.display = 'flex';
        }

        const sign = offset < 0 ? -1 : 1;
        const spreadX = offset * baseSpacing - sign * Math.max(0, absOffset - 1) * (isMobile ? 18 : 25);
        const depthZ = -Math.pow(absOffset, 1.2) * (isMobile ? 38 : 50);
        const archY = Math.pow(absOffset, 1.35) * 5.5;

        const floatY = Math.sin(now * 0.002 + i * 0.95) * 4.5;
        const idleTiltZ = Math.cos(now * 0.0015 + i * 0.8) * 0.9;

        const coverflowRotY = Math.max(-26, Math.min(26, -offset * 12 - state.velocityX * 16));

        const scale = Math.max(0.76, 1 - absOffset * 0.046);
        const edgeFade = absOffset > 3.2 ? Math.max(0, 1 - (absOffset - 3.2) * 1.1) : 1;
        const opacity = Math.max(0.65, 1 - absOffset * 0.055) * edgeFade;

        card.style.transform = `translate3d(${spreadX.toFixed(1)}px, ${(archY + floatY).toFixed(1)}px, ${depthZ.toFixed(1)}px) rotateY(${coverflowRotY.toFixed(2)}deg) rotateZ(${idleTiltZ.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
        card.style.opacity = opacity.toFixed(3);
        card.style.zIndex = String(100 - Math.round(absOffset * 10));

        card.classList.toggle('is-center', absOffset < 0.45);
      }

      updateDotsUI();
      if (!state.introSweepActive && !state.isDraggingStrip) {
        updateCounterDisplay();
      }

      requestAnimationFrame(animateLoop);
    }

    /******************************************************************
     * 9. LIGHTWEIGHT CANVAS PARTICLES
     ******************************************************************/
    function initAmbientCanvas() {
      const canvas = document.getElementById('ambientCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = (canvas.width = window.innerWidth);
      let h = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 20 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 1 + Math.random() * 2.0,
        vx: (Math.random() - 0.5) * 0.18,
        vy: -0.1 - Math.random() * 0.2,
        alpha: 0.12 + Math.random() * 0.25
      }));

      function drawParticles() {
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) {
          p.x += p.vx - state.velocityX * 1.2;
          p.y += p.vy;
          if (p.y < -10) p.y = h + 10;
          if (p.x < -10) p.x = w + 10;
          if (p.x > w + 10) p.x = -10;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(182, 149, 102, ${p.alpha})`;
          ctx.fill();
        }
        requestAnimationFrame(drawParticles);
      }
      drawParticles();
    }

    /******************************************************************
     * 10. MUSIC CONTROLLER (按需缓冲，不抢网络)
     ******************************************************************/
    function updateMusicUI(playing) {
      state.isPlayingMusic = playing;
      vinylDisc.classList.toggle('playing', playing);
      eqContainer.classList.toggle('playing', playing);
      musicStateLabel.textContent = playing ? '坂本龍一 · 正在播放' : '坂本龍一 · 已暂停';
    }

    function tryPlayMusic() {
      bgmAudio.volume = 0.78;
      const playPromise = bgmAudio.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            updateMusicUI(true);
            dismissWelcomeVeil();
          })
          .catch(() => {
            updateMusicUI(false);
          });
      }
    }

    function dismissWelcomeVeil() {
      if (!welcomeVeil || welcomeVeil.dataset.dismissed === 'true') return;
      welcomeVeil.dataset.dismissed = 'true';
      welcomeVeil.style.opacity = '0';
      welcomeVeil.style.pointerEvents = 'none';
      setTimeout(() => {
        welcomeVeil.style.display = 'none';
      }, 500);
      startOpeningAlbumSweep();
    }

    /******************************************************************
     * 11. WIRE ALL CONTROLS
     ******************************************************************/
    function wireControls() {
      welcomeVeil.addEventListener('click', () => {
        bgmAudio.play().then(() => updateMusicUI(true)).catch(() => {});
        dismissWelcomeVeil();
      });

      enterGalleryBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        bgmAudio.play().then(() => updateMusicUI(true)).catch(() => {});
        dismissWelcomeVeil();
      });

      musicToggleBtn.addEventListener('click', () => {
        if (bgmAudio.paused) {
          bgmAudio.play().then(() => updateMusicUI(true)).catch(() => {});
        } else {
          bgmAudio.pause();
          updateMusicUI(false);
        }
      });

      document.getElementById('replaySweepBtn').addEventListener('click', () => {
        startOpeningAlbumSweep();
      });

      document.getElementById('stripPrevBtn').addEventListener('click', () => {
        stepStripBy(-1);
      });
      document.getElementById('stripNextBtn').addEventListener('click', () => {
        stepStripBy(1);
      });
      document.getElementById('extractCenterBtn').addEventListener('click', () => {
        enterSingleView(wrapIndex(state.scrollX, state.photos.length));
      });

      document.getElementById('singlePrevBtn').addEventListener('click', () => {
        switchSinglePhotoTo(state.activeIndex - 1, 'prev');
      });
      document.getElementById('singleNextBtn').addEventListener('click', () => {
        switchSinglePhotoTo(state.activeIndex + 1, 'next');
      });
      document.getElementById('exitSingleBtn').addEventListener('click', () => {
        exitSingleView(false);
      });

      document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const isDark = document.body.classList.toggle('dark-theme');
        document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
      });
    }

    // Initialize Gallery
    window.addEventListener('DOMContentLoaded', () => {
      init32Photos(); // 瞬间加载 32 张照片，稳定秒开
      bindStageGestures();
      wireControls();
      initAmbientCanvas();
      requestAnimationFrame(animateLoop);
      tryPlayMusic();
    });
  </script>
