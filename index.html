<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>豆豆 · 专属相册</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #F6F3EC;
      --bg-secondary: #EDE8DF;
      --text-main: #2A2522;
      --text-muted: #7D746B;
      --gold-accent: #B69566;
      --gold-light: #DFC9A6;
      --card-bg: #FCFBF9;
      --frame-outer: #382E27;
      --frame-mat: #FAF8F3;
      --shadow-ambient: rgba(42, 37, 34, 0.14);
    }

    body.dark-theme {
      --bg-primary: #171619;
      --bg-secondary: #222026;
      --text-main: #F2ECE1;
      --text-muted: #9E9589;
      --gold-accent: #C8A97E;
      --gold-light: #8A7250;
      --card-bg: #242228;
      --frame-outer: #2A231E;
      --frame-mat: #1E1D21;
      --shadow-ambient: rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    .font-serif-display {
      font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
    }

    /* Minimalist Soft Ambient Background */
    .gallery-backdrop {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 252, 245, 0.75) 0%, transparent 68%),
        radial-gradient(circle at 85% 15%, rgba(182, 149, 102, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 15% 85%, rgba(182, 149, 102, 0.07) 0%, transparent 50%),
        var(--bg-primary);
      z-index: 0;
      transition: background 0.6s ease;
    }

    body.dark-theme .gallery-backdrop {
      background:
        radial-gradient(circle at 50% 42%, rgba(56, 48, 42, 0.32) 0%, transparent 68%),
        radial-gradient(circle at 85% 15%, rgba(200, 169, 126, 0.07) 0%, transparent 45%),
        var(--bg-primary);
    }

    /* Subtle museum wall border lines */
    .gallery-wainscot {
      position: fixed;
      inset: 16px;
      border: 1px solid rgba(182, 149, 102, 0.22);
      pointer-events: none;
      z-index: 2;
    }
    .gallery-wainscot::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(182, 149, 102, 0.09);
    }

    /* Cute Animated Puppy Styles */
    @keyframes puppyBounce {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(2deg); }
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(22deg); }
    }
    @keyframes earFlopLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes earFlopRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes heartFloat {
      0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.75; }
      50% { transform: translateY(-4px) scale(1.12); opacity: 1; }
    }

    .puppy-avatar {
      animation: puppyBounce 2.2s ease-in-out infinite;
    }
    .puppy-tail {
      transform-origin: 48px 42px;
      animation: tailWag 0.45s ease-in-out infinite;
    }
    .puppy-ear-l {
      transform-origin: 20px 20px;
      animation: earFlopLeft 1.1s ease-in-out infinite;
    }
    .puppy-ear-r {
      transform-origin: 44px 20px;
      animation: earFlopRight 1.1s ease-in-out infinite;
    }
    .puppy-eyes {
      transform-origin: 32px 28px;
      animation: eyeBlink 3.6s infinite;
    }
    .puppy-heart {
      animation: heartFloat 1.8s ease-in-out infinite;
    }

    /* 3D Stage for Album Strip */
    .album-stage-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1600px;
      z-index: 10;
      transition: transform 0.82s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.72s cubic-bezier(0.22, 1, 0.36, 1),
                  filter 0.72s ease;
      will-change: transform, opacity;
      touch-action: none;
    }

    /* When a photo is extracted into Single View, the album strip slowly sinks down */
    .album-stage-wrapper.sunken {
      transform: translateY(35vh) scale(0.66);
      opacity: 0.48;
      filter: blur(0.8px);
    }

    .album-track {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    /* Individual Album Card in the Strip */
    .album-card {
      position: absolute;
      width: 284px;
      height: 360px;
      left: -142px;
      top: -180px;
      background: var(--card-bg);
      border-radius: 6px;
      padding: 16px 16px 18px 16px;
      box-shadow:
        0 22px 46px -12px var(--shadow-ambient),
        0 4px 14px -2px rgba(0, 0, 0, 0.06),
        inset 0 0 0 1px rgba(182, 149, 102, 0.32);
      cursor: pointer;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      transition: box-shadow 0.35s ease, background-color 0.4s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (max-width: 640px) {
      .album-card {
        width: 236px;
        height: 310px;
        left: -118px;
        top: -155px;
        padding: 13px 13px 15px 13px;
      }
    }

    /* Inner decorative hairline inside card */
    .album-card::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(182, 149, 102, 0.18);
      border-radius: 3px;
      pointer-events: none;
      transition: border-color 0.35s ease;
    }

    .album-card:hover::before,
    .album-card.is-center::before {
      border-color: rgba(182, 149, 102, 0.58);
    }

    .album-card:hover {
      box-shadow:
        0 28px 58px -12px rgba(182, 149, 102, 0.35),
        0 8px 22px -4px rgba(0, 0, 0, 0.09),
        inset 0 0 0 1.5px rgba(182, 149, 102, 0.65);
    }

    /* When this specific card is extracted upward into the center frame */
    .album-card.extracted-slot .card-inner-content {
      opacity: 0.14;
      transform: scale(0.92);
      filter: grayscale(0.8);
    }
    .album-card.extracted-slot::after {
      content: '正在上方展映';
      position: absolute;
      inset: 18px;
      border: 1.5px dashed rgba(182, 149, 102, 0.65);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--gold-accent);
      font-weight: 500;
      background: rgba(182, 149, 102, 0.05);
    }

    .card-inner-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    /* Photo Corner Mounts */
    .photo-viewport {
      position: relative;
      width: 100%;
      height: 258px;
      overflow: hidden;
      background: #E5E0D5;
      border-radius: 2px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.12);
    }
    @media (max-width: 640px) {
      .photo-viewport {
        height: 216px;
      }
    }

    .photo-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .album-card:hover .photo-viewport img {
      transform: scale(1.06);
    }

    /* Diagonal shimmer sheen on photo */
    .photo-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, transparent 30%, rgba(255, 255, 255, 0.32) 48%, transparent 66%);
      transform: translateX(-120%);
      transition: transform 0.75s ease;
      pointer-events: none;
    }
    .album-card:hover .photo-shimmer,
    .album-card.is-center .photo-shimmer {
      transform: translateX(120%);
    }

    /* Vintage Gold Corner Brackets */
    .corner-mount {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--gold-accent);
      border-style: solid;
      z-index: 4;
      pointer-events: none;
      opacity: 0.85;
      transition: all 0.3s ease;
    }
    .album-card:hover .corner-mount,
    .album-card.is-center .corner-mount {
      width: 18px;
      height: 18px;
      opacity: 1;
    }
    .corner-tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

    /* Interactive "Click me" floating seal badge */
    .invite-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(38, 32, 28, 0.76);
      backdrop-filter: blur(6px);
      color: #F7EFE2;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(212, 182, 132, 0.55);
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transform: translateY(6px) scale(0.92);
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 5;
    }
    .album-card:hover .invite-badge,
    .album-card.is-center .invite-badge {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @keyframes gentlePulseRing {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.22); opacity: 0.4; }
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #E6C387;
      animation: gentlePulseRing 1.8s infinite ease-in-out;
    }

    /* Dot scroll container for handling any number of photos */
    .dots-scroll-box {
      max-width: min(38vw, 300px);
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 4px;
    }
    .dots-scroll-box::-webkit-scrollbar {
      display: none;
    }

    /* Floating Screen Navigation Arrows for Strip View */
    .strip-stage-nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: rgba(252, 251, 249, 0.92);
      border: 1px solid rgba(182, 149, 102, 0.45);
      color: #2A2522;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -4px rgba(42, 37, 34, 0.16);
      backdrop-filter: blur(8px);
      z-index: 25;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.dark-theme .strip-stage-nav-btn {
      background: rgba(36, 34, 40, 0.92);
      color: #F2ECE1;
      border-color: rgba(200, 169, 126, 0.35);
      box-shadow: 0 10px 25px -4px rgba(0, 0, 0, 0.4);
    }
    .strip-stage-nav-btn:hover {
      background: var(--gold-accent);
      color: #FFFFFF;
      transform: translateY(-50%) scale(1.08);
      box-shadow: 0 14px 30px -4px rgba(182, 149, 102, 0.35);
    }
    .strip-stage-nav-btn.prev {
      left: 18px;
    }
    .strip-stage-nav-btn.next {
      right: 18px;
    }
    @media (max-width: 640px) {
      .strip-stage-nav-btn {
        width: 38px;
        height: 38px;
      }
      .strip-stage-nav-btn.prev { left: 8px; }
      .strip-stage-nav-btn.next { right: 8px; }
    }

    /* ============================================================
       EXTRACTED SINGLE PHOTO STAGE (精致相框单独查看层)
       ============================================================ */
    .single-stage-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      perspective: 1600px;
      transition: opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1);
      touch-action: none;
    }

    .single-stage-overlay.active {
      pointer-events: auto;
      opacity: 1;
    }

    .single-backdrop-veil {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 42%, rgba(246, 243, 236, 0.55) 0%, rgba(235, 229, 218, 0.86) 100%);
      backdrop-filter: blur(3px);
      z-index: -1;
      transition: opacity 0.5s ease;
    }
    body.dark-theme .single-backdrop-veil {
      background: radial-gradient(circle at 50% 42%, rgba(24, 23, 27, 0.65) 0%, rgba(16, 15, 18, 0.9) 100%);
    }

    .exquisite-frame-wrapper {
      position: relative;
      transform-style: preserve-3d;
      transform: translateY(210px) scale(0.52) rotateX(14deg);
      transition: transform 0.72s cubic-bezier(0.19, 1, 0.22, 1),
                  opacity 0.52s ease;
      will-change: transform, opacity;
      max-width: 92vw;
      margin-bottom: 6vh;
      cursor: grab;
    }
    .exquisite-frame-wrapper:active {
      cursor: grabbing;
    }

    .single-stage-overlay.active .exquisite-frame-wrapper {
      transform: translateY(-18px) scale(1) rotateX(0deg);
    }

    .exquisite-frame-wrapper.no-transition {
      transition: none !important;
    }

    /* Distinct Single-View Horizontal Switch Animations */
    @keyframes singleSlideOutLeft {
      0% { transform: translateY(-18px) translateX(0) translateZ(0) rotateY(0deg); opacity: 1; }
      100% { transform: translateY(-18px) translateX(-52%) translateZ(-180px) rotateY(-34deg) rotateZ(-2deg); opacity: 0; }
    }
    @keyframes singleSlideInRight {
      0% { transform: translateY(-18px) translateX(52%) translateZ(-180px) rotateY(34deg) rotateZ(2deg); opacity: 0; }
      100% { transform: translateY(-18px) translateX(0) translateZ(0) rotateY(0deg) rotateZ(0deg); opacity: 1; }
    }
    @keyframes singleSlideOutRight {
      0% { transform: translateY(-18px) translateX(0) translateZ(0) rotateY(0deg); opacity: 1; }
      100% { transform: translateY(-18px) translateX(52%) translateZ(-180px) rotateY(34deg) rotateZ(2deg); opacity: 0; }
    }
    @keyframes singleSlideInLeft {
      0% { transform: translateY(-18px) translateX(-52%) translateZ(-180px) rotateY(-34deg) rotateZ(-2deg); opacity: 0; }
      100% { transform: translateY(-18px) translateX(0) translateZ(0) rotateY(0deg) rotateZ(0deg); opacity: 1; }
    }

    .exquisite-frame-wrapper.anim-out-left {
      animation: singleSlideOutLeft 0.34s cubic-bezier(0.4, 0, 0.8, 0.6) forwards;
    }
    .exquisite-frame-wrapper.anim-in-right {
      animation: singleSlideInRight 0.46s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }
    .exquisite-frame-wrapper.anim-out-right {
      animation: singleSlideOutRight 0.34s cubic-bezier(0.4, 0, 0.8, 0.6) forwards;
    }
    .exquisite-frame-wrapper.anim-in-left {
      animation: singleSlideInLeft 0.46s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    /* Museum Frame Carved Styling */
    .museum-outer-frame {
      position: relative;
      background: linear-gradient(145deg, #43372E 0%, #29211B 50%, #3B3028 100%);
      padding: 14px;
      border-radius: 8px;
      box-shadow:
        0 38px 75px -15px rgba(28, 22, 18, 0.42),
        0 12px 28px -6px rgba(28, 22, 18, 0.24),
        inset 0 1px 1px rgba(255, 238, 210, 0.35),
        inset 0 0 0 2px #8B6F47;
    }

    .museum-mat-board {
      position: relative;
      background: var(--frame-mat);
      padding: 26px 28px 20px 28px;
      border-radius: 3px;
      border: 2px solid #C6A677;
      box-shadow:
        inset 0 0 24px rgba(139, 111, 71, 0.12),
        0 2px 6px rgba(0, 0, 0, 0.25);
    }

    @media (max-width: 640px) {
      .museum-outer-frame { padding: 10px; }
      .museum-mat-board { padding: 16px 16px 14px 16px; }
    }

    .museum-image-bevel {
      position: relative;
      width: min(560px, 78vw);
      height: min(390px, 52vh);
      padding: 5px;
      background: linear-gradient(135deg, #D5BC94 0%, #9E7F53 50%, #E7D4B5 100%);
      box-shadow:
        inset 0 3px 8px rgba(0, 0, 0, 0.28),
        0 1px 2px rgba(255, 255, 255, 0.8);
      overflow: hidden;
    }

    .museum-image-bevel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #E8E3D9;
      pointer-events: none;
    }

    .frame-filigree {
      position: absolute;
      width: 28px;
      height: 28px;
      pointer-events: none;
      z-index: 5;
      color: #D6B785;
      opacity: 0.92;
    }
    .filigree-tl { top: 6px; left: 6px; }
    .filigree-tr { top: 6px; right: 6px; transform: scaleX(-1); }
    .filigree-bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
    .filigree-br { bottom: 6px; right: 6px; transform: scale(-1, -1); }

    .museum-plaque {
      margin-top: 16px;
      padding: 10px 20px;
      background: linear-gradient(90deg, rgba(198, 166, 119, 0.10) 0%, rgba(198, 166, 119, 0.22) 50%, rgba(198, 166, 119, 0.10) 100%);
      border-top: 1px solid rgba(182, 149, 102, 0.42);
      border-bottom: 1px solid rgba(182, 149, 102, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Vinyl Disc */
    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .vinyl-disc {
      animation: spinVinyl 6s linear infinite;
      animation-play-state: paused;
    }
    .vinyl-disc.playing {
      animation-play-state: running;
    }

    /* Equalizer */
    @keyframes eqBar1 { 0%, 100% { height: 4px; } 50% { height: 14px; } }
    @keyframes eqBar2 { 0%, 100% { height: 13px; } 40% { height: 4px; } 80% { height: 15px; } }
    @keyframes eqBar3 { 0%, 100% { height: 6px; } 60% { height: 16px; } }
    .eq-bar {
      width: 2.5px;
      background: var(--gold-accent);
      border-radius: 2px;
      height: 4px;
      transition: height 0.2s ease;
    }
    .playing .eq-bar-1 { animation: eqBar1 0.8s infinite ease-in-out; }
    .playing .eq-bar-2 { animation: eqBar2 0.7s infinite ease-in-out; }
    .playing .eq-bar-3 { animation: eqBar3 0.9s infinite ease-in-out; }
    .playing .eq-bar-4 { animation: eqBar1 0.65s infinite ease-in-out 0.2s; }

    /* Downward Swipe Hint Bounce */
    @keyframes swipeDownHint {
      0%, 100% { transform: translateY(0); opacity: 0.78; }
      50% { transform: translateY(5px); opacity: 1; }
    }
    .swipe-down-pill {
      animation: swipeDownHint 2.2s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <!-- Background & Subtle Dust Canvas -->
  <div class="gallery-backdrop"></div>
  <canvas id="ambientCanvas" class="fixed inset-0 pointer-events-none z-[1]"></canvas>
  <div class="gallery-wainscot"></div>

  <!-- Background Audio: Merry Christmas Mr. Lawrence - 坂本龍一 -->
  <audio id="bgmAudio" src="./music/bgm.mp3" loop preload="auto"></audio>

  <!-- ============================================================
       TOP NAVIGATION & MUSIC CONTROLLER BAR
       ============================================================ -->
  <header class="fixed top-0 left-0 right-0 z-40 px-6 py-4 flex items-center justify-between gap-3 pointer-events-none">
    <!-- Left Brand / Title: 豆豆 + Cute Animated Puppy -->
    <div class="flex items-center gap-2.5 pointer-events-auto">
      <div class="w-11 h-11 rounded-full border border-[#B69566]/45 flex items-center justify-center bg-[#FCFBF9]/90 backdrop-blur-md shadow-sm overflow-visible relative">
        <svg class="puppy-avatar w-9 h-9" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path class="puppy-tail" d="M47 43C53 39 56 33 54 29C52 26 48 31 46 38" stroke="#C89B6E" stroke-width="4.5" stroke-linecap="round"/>
          <ellipse cx="34" cy="45" rx="14" ry="10" fill="#F3DEC3" stroke="#8C6239" stroke-width="2"/>
          <path d="M23 38C28 41 36 41 41 38" stroke="#E05A47" stroke-width="3" stroke-linecap="round"/>
          <circle cx="32" cy="41" r="2.8" fill="#F4C542" stroke="#8C6239" stroke-width="1.2"/>
          <g class="puppy-ear-l">
            <ellipse cx="17" cy="24" rx="5.5" ry="10.5" transform="rotate(18 17 24)" fill="#C89B6E" stroke="#8C6239" stroke-width="2"/>
          </g>
          <g class="puppy-ear-r">
            <ellipse cx="47" cy="24" rx="5.5" ry="10.5" transform="rotate(-18 47 24)" fill="#C89B6E" stroke="#8C6239" stroke-width="2"/>
          </g>
          <circle cx="32" cy="25" r="14" fill="#FFF5E6" stroke="#8C6239" stroke-width="2"/>
          <path d="M26 12C29 16 35 16 38 12" fill="#E3B98B"/>
          <g class="puppy-eyes">

  <!-- ============================================================
       CORE INTERACTION & INFINITE CIRCULAR GALLERY ENGINE
       ============================================================ -->
  <script>
    /******************************************************************
     * 【用户相册配置区 USER_CONFIG】
     * 无论放入多少张照片均可自由展示！
     * 1. 默认模式（photoCount: 'auto'）：
     *    把照片按 1.jpg, 2.jpg, 3.jpg ... 放入同级 photos/ 文件夹即可自动探测全部照片。
     * 2. 指定张数模式：例如 photoCount: 15。
     * 3. 自定义文件名模式：customPhotos: ['a.jpg', 'b.png']。
     ******************************************************************/
    const USER_CONFIG = {
      photoFolder: './photos/',
      musicFile: './music/bgm.mp3',
      photoCount: 'auto',       // 'auto' (自动扫描探测) | 数字 (如 12, 16)
      customPhotos: [],         // 自定义文件名列表，例如 ['a.jpg', 'b.png']
      maxAutoScan: 60           // 自动探测最大张数上限
    };

    // 默认内置兜底示范照片
    const DEMO_FALLBACK_PHOTOS = [
      { url: './photos/1.jpg' },
      { url: './photos/2.jpg' },
      { url: './photos/3.jpg' },
      { url: './photos/4.jpg' },
      { url: './photos/5.jpg' },
      { url: './photos/6.jpg' },
      { url: './photos/7.jpg' },
      { url: './photos/8.jpg' }
    ];

    // State Management
    const state = {
      photos: DEMO_FALLBACK_PHOTOS.map((p, idx) => ({
        id: idx,
        resolvedSrc: p.url,
        caption: '开开心心'
      })),
      viewMode: 'strip',        // 'strip' (全部展示) | 'single' (单独相框展示)
      activeIndex: 0,           // Currently centered or extracted photo index (0 .. N-1)
      scrollX: 0,               // Continuous scroll position (supports infinite circular wrapping)
      targetScrollX: 0,         // Target scroll position
      velocityX: 0,             // Momentum velocity in strip
      isDraggingStrip: false,
      dragMoved: false,
      pointerStartX: 0,
      pointerStartY: 0,
      lastPointerX: 0,
      lastPointerTime: 0,

      // Opening 2.0-second fast-to-slow circular sweep state
      introSweepActive: false,
      introBraking: false,
      introStartTime: 0,
      introDuration: 2000,      // 严格 2.0 秒入场由快到慢动画
      introStartScroll: 0,
      introEndScroll: 0,

      // Single Framed View gesture state
      isDraggingSingle: false,
      singleDragDX: 0,
      singleDragDY: 0,
      isTransitioningSingle: false,

      // Audio state
      isPlayingMusic: false
    };

    // DOM References
    const albumStageWrapper = document.getElementById('albumStageWrapper');
    const albumTrack = document.getElementById('albumTrack');
    const stripStagePrevBtn = document.getElementById('stripStagePrevBtn');
    const stripStageNextBtn = document.getElementById('stripStageNextBtn');
    const singleStageOverlay = document.getElementById('singleStageOverlay');
    const exquisiteFrameWrapper = document.getElementById('exquisiteFrameWrapper');
    const singleFramedImg = document.getElementById('singleFramedImg');
    const singleFramedTitle = document.getElementById('singleFramedTitle');
    const statusToast = document.getElementById('statusToast');
    const counterText = document.getElementById('counterText');
    const modeStatusText = document.getElementById('modeStatusText');
    const dotIndicators = document.getElementById('dotIndicators');
    const stripFooterBar = document.getElementById('stripFooterBar');
    const welcomePhotoNotice = document.getElementById('welcomePhotoNotice');

    const bgmAudio = document.getElementById('bgmAudio');
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const vinylDisc = document.getElementById('vinylDisc');
    const eqContainer = document.getElementById('eqContainer');
    const musicStateLabel = document.getElementById('musicStateLabel');
    const welcomeVeil = document.getElementById('welcomeVeil');
    const enterGalleryBtn = document.getElementById('enterGalleryBtn');

    let cardElements = [];

    // Helper: Wrap any continuous index into [0, total - 1]
    function wrapIndex(idx, total) {
      if (total <= 0) return 0;
      return ((Math.round(idx) % total) + total) % total;
    }

    // Helper: Shortest circular offset between card `i` and `scrollX`
    function getCircularOffset(i, scrollX, total) {
      if (total <= 1) return 0;
      let diff = (i - scrollX) % total;
      if (diff > total / 2) diff -= total;
      if (diff < -total / 2) diff += total;
      return diff;
    }

    // Helper: Move targetScrollX to the nearest equivalent position matching targetIdx (0 .. N-1)
    function getNearestTargetScroll(currentScroll, targetIdx, total) {
      if (total <= 1) return 0;
      const diff = getCircularOffset(targetIdx, currentScroll, total);
      return Math.round(currentScroll + diff);
    }

    /******************************************************************
     * 1. ULTRA-FAST PARALLEL PHOTO DISCOVERY (瞬间探测任意数量照片)
     ******************************************************************/
    function probeSingleCandidate(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(url);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    function scanPhotoIndex(folder, index) {
      const exts = ['.jpg', '.JPG', '.png', '.PNG', '.jpeg', '.JPEG', '.webp'];
      return new Promise((resolve) => {
        let settled = 0;
        let found = false;
        exts.forEach((ext) => {
          probeSingleCandidate(`${folder}${index}${ext}`).then((url) => {
            if (url && !found) {
              found = true;
              resolve({ index, url });
            }
            settled++;
            if (settled === exts.length && !found) {
              resolve(null);
            }
          });
        });
      });
    }

    async function discoverAllPhotos() {
      const folder = USER_CONFIG.photoFolder;
      let discoveredList = [];

      if (Array.isArray(USER_CONFIG.customPhotos) && USER_CONFIG.customPhotos.length > 0) {
        discoveredList = USER_CONFIG.customPhotos.map((fname, idx) => ({
          id: idx,
          resolvedSrc: `${folder}${fname}`,
          caption: '开开心心'
        }));
        applyDiscoveredPhotos(discoveredList);
        return;
      }

      if (typeof USER_CONFIG.photoCount === 'number' && USER_CONFIG.photoCount > 0) {
        const count = USER_CONFIG.photoCount;
        const promises = [];
        for (let i = 1; i <= count; i++) {
          promises.push(scanPhotoIndex(folder, i));
        }
        const results = await Promise.all(promises);
        discoveredList = results.map((res, idx) => ({
          id: idx,
          resolvedSrc: (res && res.url) ? res.url : `${folder}${idx + 1}.jpg`,
          caption: '开开心心'
        }));
        applyDiscoveredPhotos(discoveredList);
        return;
      }

      const maxScan = USER_CONFIG.maxAutoScan || 60;
      const scanPromises = [];
      for (let i = 1; i <= maxScan; i++) {
        scanPromises.push(scanPhotoIndex(folder, i));
      }

      const scanResults = await Promise.all(scanPromises);

      for (let i = 0; i < scanResults.length; i++) {
        const item = scanResults[i];
        if (item && item.url) {
          discoveredList.push({
            id: discoveredList.length,
            resolvedSrc: item.url,
            caption: '开开心心'
          });
        } else if (discoveredList.length > 0) {
          if (i + 1 < scanResults.length && scanResults[i + 1] && scanResults[i + 1].url) {
            continue;
          }
          break;
        }
      }

      if (discoveredList.length > 0) {
        applyDiscoveredPhotos(discoveredList);
      }
    }

    function applyDiscoveredPhotos(list) {
      if (!list || list.length === 0) return;
      state.photos = list;
      buildAlbumDOM();

      if (welcomePhotoNotice) {
        welcomePhotoNotice.innerHTML = `每一刻都开开心心 🐾<br/>已就绪全部 ${state.photos.length} 张照片，2秒循环掠过后稳稳停在画卷正中。`;
      }
      modeStatusText.textContent = `DOUDOU GALLERY · 全部 ${state.photos.length} 张照片已加载`;
      updateCounterDisplay();
    }

    /******************************************************************
     * 2. RENDER ALBUM CARDS & DOT INDICATORS (展示全部照片，底部统一开开心心)
     ******************************************************************/
    function buildAlbumDOM() {
      albumTrack.innerHTML = '';
      dotIndicators.innerHTML = '';
      cardElements = [];

      const total = state.photos.length;
      // 如果照片特别少（例如只有 2~4 张），为了保证环形画卷左右两侧同时饱满对称且支持循环滑动，
      // 我们在渲染轨道中自动克隆视觉副本（点击任意副本依然对应原始照片序号）
      let minVisualSlots = Math.max(total, 7);
      let visualMultiplier = 1;
      if (total > 0 && total < 7) {
        visualMultiplier = Math.ceil(7 / total);
      }
      const totalVisualCards = total * visualMultiplier;

      for (let vIdx = 0; vIdx < totalVisualCards; vIdx++) {
        const realIndex = vIdx % total;
        const photo = state.photos[realIndex];

        const card = document.createElement('article');
        card.className = 'album-card';
        card.dataset.index = String(realIndex);
        card.dataset.visualIndex = String(vIdx);

        card.innerHTML = `
          <div class="card-inner-content">
            <div class="photo-viewport">
              <span class="corner-mount corner-tl"></span>
              <span class="corner-mount corner-tr"></span>
              <span class="corner-mount corner-bl"></span>
              <span class="corner-mount corner-br"></span>
              <img src="${photo.resolvedSrc}" alt="开开心心" draggable="false" />
              <div class="photo-shimmer"></div>
              <div class="invite-badge">
                <span class="pulse-dot"></span>
                <span>查看装裱</span>
              </div>
            </div>

            <!-- Uniform Card Footer: 开开心心 -->
            <div class="pt-2 flex items-center justify-center gap-2">
              <span class="text-[#B69566] text-xs">✦</span>
              <h3 class="font-serif-display text-base font-semibold tracking-[0.22em] text-[#2A2522] dark:text-[#F2ECE1]">开开心心</h3>
              <span class="text-[#B69566] text-xs">✦</span>
            </div>
          </div>
        `;

        card.addEventListener('click', (e) => {
          e.stopPropagation();
          handleCardClick(realIndex, vIdx);
        });

        albumTrack.appendChild(card);
        cardElements.push(card);
      }

      // 底部指示圆点严格对应真实照片数量 (1 .. total)
      for (let index = 0; index < total; index++) {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'h-1.5 rounded-full transition-all duration-300 bg-[#B69566]/35 hover:bg-[#B69566] w-1.5 flex-shrink-0';
        dot.title = `第 ${index + 1} 张 · 开开心心`;
        dot.addEventListener('click', () => {
          if (state.introSweepActive) {
            triggerIntroSmoothBrake(index);
          } else if (state.viewMode === 'strip') {
            focusCardToRealIndex(index);
          } else {
            switchSinglePhotoTo(index, index > state.activeIndex ? 'next' : 'prev');
          }
        });
        dotIndicators.appendChild(dot);
      }

      updateDotsUI();
      updateCounterDisplay();
    }

    function updateCounterDisplay() {
      if (!counterText) return;
      const total = state.photos.length;
      const current = wrapIndex(state.scrollX, total) + 1;
      counterText.textContent = `第 ${current} / ${total} 张 · 开开心心 🐾`;
    }

    function updateDotsUI() {
      const dots = dotIndicators.children;
      const total = state.photos.length;
      const centerRealIdx = wrapIndex(state.scrollX, total);
      const highlightIdx = state.viewMode === 'single' ? state.activeIndex : centerRealIdx;

      for (let i = 0; i < dots.length; i++) {
        if (i === highlightIdx) {
          dots[i].className = 'h-1.5 rounded-full transition-all duration-300 bg-[#B69566] w-5 flex-shrink-0';
          if (dots[i].scrollIntoView) {
            dots[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          }
        } else {
          dots[i].className = 'h-1.5 rounded-full transition-all duration-300 bg-[#B69566]/30 hover:bg-[#B69566]/60 w-1.5 flex-shrink-0';
        }
      }
    }

    function showToast(msg) {
      if (!statusToast) return;
      if (counterText) counterText.textContent = msg;
    }

    /******************************************************************
     * 3. 2-SECOND CIRCULAR LOOP SWEEP & GOLDEN-CENTER LANDING
     * - 动画时间严格设定为 2.0 秒，速度由快到慢。
     * - 当照片较少时自动循环播放多圈以充实 2 秒动画。
     * - 2 秒结束时绝不停在边缘最后一张，而是稳稳停在画卷黄金正中间位（左右两侧都有对称展开的照片），视觉极其饱满美观！
     ******************************************************************/
    function startOpeningAlbumSweep() {
      if (state.viewMode === 'single') {
        exitSingleView(true);
      }

      const total = state.photos.length;
      const visualTotal = cardElements.length || total;

      // 挑选黄金中心停靠位：例如 8 张照片停在第 4 张（索引 3），且由于是环形画卷，左右两侧永远对称铺满照片，绝不会停在单边尽头！
      const goldenCenterIndex = total > 2 ? Math.floor((total - 1) / 2) : 0;

      // 计算在 2.0 秒内掠过的总卡片步数（保持约 8~10 张的丰富流光感；如果图片少会自动循环转圈来达到 2 秒）
      const minSweepCards = 8;
      let loops = 1;
      while (loops * visualTotal + goldenCenterIndex < minSweepCards) {
        loops++;
      }

      // 起点设置在负向 loops * visualTotal，经过 2.0 秒由快到慢正好滑过所有照片并停在正中央 goldenCenterIndex
      state.introStartScroll = -(loops * visualTotal);
      state.introEndScroll = goldenCenterIndex;
      state.scrollX = state.introStartScroll;
      state.targetScrollX = state.introEndScroll;
      state.activeIndex = goldenCenterIndex;
      state.velocityX = 0;

      state.introSweepActive = true;
      state.introBraking = false;
      state.introDuration = 2000; // 严格设定为 2.0 秒
      state.introStartTime = performance.now();

      showToast(`✨ 画卷循环掠过中 · 2秒由快到慢停在中心位 (点击可随时停驻)`);
    }

    function triggerIntroSmoothBrake(preferredRealIndex = null) {
      if (!state.introSweepActive || state.introBraking) return;
      state.introBraking = true;
      state.introSweepActive = false;

      const total = state.photos.length;
      const visualTotal = cardElements.length || total;

      let landingScroll;
      if (preferredRealIndex !== null) {
        landingScroll = getNearestTargetScroll(state.scrollX, preferredRealIndex, visualTotal);
      } else {
        landingScroll = Math.round(state.scrollX + 0.35);
      }

      state.targetScrollX = landingScroll;
      state.activeIndex = wrapIndex(landingScroll, total);
      updateCounterDisplay();
    }

    function stepStripBy(deltaSteps) {
      state.introSweepActive = false;
      state.introBraking = false;
      state.velocityX = 0;
      state.targetScrollX = Math.round(state.targetScrollX + deltaSteps);
      state.activeIndex = wrapIndex(state.targetScrollX, state.photos.length);
      updateCounterDisplay();
    }

    function focusCardToRealIndex(realIndex) {
      const total = state.photos.length;
      state.introSweepActive = false;
      state.introBraking = false;
      state.velocityX = 0;
      const diff = getCircularOffset(realIndex, state.targetScrollX, total);
      state.targetScrollX = Math.round(state.targetScrollX + diff);
      state.activeIndex = wrapIndex(state.targetScrollX, total);
      updateCounterDisplay();
    }

    /******************************************************************
     * 4. CARD CLICK -> EXTRACT PHOTO UPWARD INTO MUSEUM FRAME
     ******************************************************************/
    function handleCardClick(realIndex, visualIdx) {
      if (state.dragMoved) return;

      if (state.introSweepActive) {
        triggerIntroSmoothBrake(realIndex);
        return;
      }

      if (state.viewMode === 'single') {
        if (realIndex !== state.activeIndex) {
          const diff = getCircularOffset(realIndex, state.activeIndex, state.photos.length);
          switchSinglePhotoTo(realIndex, diff >= 0 ? 'next' : 'prev');
        }
        return;
      }

      // 将画卷平滑对齐到被点击的卡片并向上抽出装裱
      const visualTotal = cardElements.length || state.photos.length;
      const offset = getCircularOffset(visualIdx, state.scrollX, visualTotal);
      state.targetScrollX = Math.round(state.scrollX + offset);
      enterSingleView(realIndex);
    }

    function enterSingleView(realIndex) {
      const total = state.photos.length;
      const clamped = wrapIndex(realIndex, total);
      state.activeIndex = clamped;
      state.velocityX = 0;
      state.viewMode = 'single';

      populateSingleFrameContent(clamped);

      const centerVisualIdx = wrapIndex(state.targetScrollX, cardElements.length);
      cardElements.forEach((el, idx) => {
        el.classList.toggle('extracted-slot', idx === centerVisualIdx);
      });

      albumStageWrapper.classList.add('sunken');
      singleStageOverlay.classList.add('active');
      singleStageOverlay.setAttribute('aria-hidden', 'false');
      stripFooterBar.style.opacity = '0';
      stripFooterBar.style.pointerEvents = 'none';

      modeStatusText.textContent = `DOUDOU GALLERY · 第 ${clamped + 1} 张 · 开开心心`;
      updateDotsUI();
    }

    function populateSingleFrameContent(index) {
      const item = state.photos[index];
      if (!item) return;
      singleFramedImg.src = item.resolvedSrc;
      singleFramedImg.alt = '开开心心';
      singleFramedTitle.textContent = '开开心心';
    }

    /******************************************************************
     * 5. SWIPE DOWN OR CLICK TO RETURN TO ALBUM STRIP CENTER
     ******************************************************************/
    function exitSingleView(instant = false) {
      if (state.viewMode !== 'single') return;
      state.viewMode = 'strip';

      const total = state.photos.length;
      const diff = getCircularOffset(state.activeIndex, state.scrollX, total);
      state.targetScrollX = Math.round(state.scrollX + diff);
      if (instant) {
        state.scrollX = state.targetScrollX;
      }

      exquisiteFrameWrapper.classList.remove('no-transition', 'anim-out-left', 'anim-in-right', 'anim-out-right', 'anim-in-left');
      exquisiteFrameWrapper.style.transform = '';
      exquisiteFrameWrapper.style.opacity = '';
      albumStageWrapper.style.transform = '';
      albumStageWrapper.style.opacity = '';

      albumStageWrapper.classList.remove('sunken');
      singleStageOverlay.classList.remove('active');
      singleStageOverlay.setAttribute('aria-hidden', 'true');

      cardElements.forEach((el) => el.classList.remove('extracted-slot'));

      stripFooterBar.style.opacity = '1';
      stripFooterBar.style.pointerEvents = 'none';

      modeStatusText.textContent = `DOUDOU GALLERY · 全部 ${state.photos.length} 张照片展示中`;
      updateDotsUI();
      updateCounterDisplay();
    }

    /******************************************************************
     * 6. SWITCH PHOTO IN SINGLE VIEW (支持无限循环切换)
     ******************************************************************/
    function switchSinglePhotoTo(newIndex, direction = 'next') {
      if (state.isTransitioningSingle || state.photos.length <= 1) return;
      const total = state.photos.length;
      const wrappedIndex = wrapIndex(newIndex, total);
      if (wrappedIndex === state.activeIndex) return;

      state.isTransitioningSingle = true;
      exquisiteFrameWrapper.classList.remove('no-transition', 'anim-out-left', 'anim-in-right', 'anim-out-right', 'anim-in-left');
      exquisiteFrameWrapper.style.transform = '';

      const outClass = direction === 'next' ? 'anim-out-left' : 'anim-out-right';
      const inClass = direction === 'next' ? 'anim-in-right' : 'anim-in-left';

      exquisiteFrameWrapper.classList.add(outClass);

      state.activeIndex = wrappedIndex;
      const stepDelta = direction === 'next' ? 1 : -1;
      state.targetScrollX = Math.round(state.targetScrollX + stepDelta);

      const centerVisualIdx = wrapIndex(state.targetScrollX, cardElements.length);
      cardElements.forEach((el, idx) => {
        el.classList.toggle('extracted-slot', idx === centerVisualIdx);
      });
      updateDotsUI();

      setTimeout(() => {
        populateSingleFrameContent(wrappedIndex);
        exquisiteFrameWrapper.classList.remove(outClass);
        exquisiteFrameWrapper.classList.add(inClass);

        setTimeout(() => {
          exquisiteFrameWrapper.classList.remove(inClass);
          state.isTransitioningSingle = false;
        }, 460);
      }, 310);
    }

    /******************************************************************
     * 7. GESTURES & SCREEN BUTTON CONTROLS (支持无限循环拖拽与点击)
     ******************************************************************/
    function bindStageGestures() {
      stripStagePrevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        stepStripBy(-1);
      });
      stripStageNextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        stepStripBy(1);
      });

      albumStageWrapper.addEventListener('pointerdown', (e) => {
        if (state.viewMode !== 'strip') return;
        if (e.target.closest('button')) return;

        if (state.introSweepActive) {
          triggerIntroSmoothBrake();
          state.dragMoved = true;
          setTimeout(() => { state.dragMoved = false; }, 120);
          return;
        }

        state.isDraggingStrip = true;
        state.dragMoved = false;
        state.pointerStartX = e.clientX;
        state.lastPointerX = e.clientX;
        state.lastPointerTime = performance.now();
        state.velocityX = 0;
      });

      window.addEventListener('pointermove', (e) => {
        if (state.isDraggingStrip && state.viewMode === 'strip') {
          const dx = e.clientX - state.lastPointerX;
          const totalDx = Math.abs(e.clientX - state.pointerStartX);
          if (totalDx > 7) {
            state.dragMoved = true;
          }

          const now = performance.now();
          const dt = Math.max(8, now - state.lastPointerTime);
          const cardSpacing = window.innerWidth < 640 ? 210 : 265;

          const deltaCards = -dx / cardSpacing;
          state.scrollX += deltaCards;
          state.targetScrollX = state.scrollX;
          state.velocityX = (deltaCards / dt) * 16.67;

          state.lastPointerX = e.clientX;
          state.lastPointerTime = now;
        }

        if (state.isDraggingSingle && state.viewMode === 'single' && !state.isTransitioningSingle) {
          state.singleDragDX = e.clientX - state.pointerStartX;
          state.singleDragDY = e.clientY - state.pointerStartY;

          const dx = state.singleDragDX;
          const dy = state.singleDragDY;

          if (dy > 15 && Math.abs(dy) > Math.abs(dx) * 1.15) {
            const progress = Math.min(1, dy / 220);
            const followY = -18 + dy * 0.68;
            const scale = 1 - progress * 0.32;
            const rotX = progress * 10;
            exquisiteFrameWrapper.style.transform = `translateY(${followY}px) scale(${scale}) rotateX(${rotX}deg)`;

            const stripY = 35 * (1 - progress * 0.65);
            const stripScale = 0.66 + progress * 0.22;
            albumStageWrapper.style.transform = `translateY(${stripY}vh) scale(${stripScale})`;
            albumStageWrapper.style.opacity = String(0.48 + progress * 0.35);
          } else {
            const tiltY = Math.max(-24, Math.min(24, dx * 0.08));
            const shiftX = dx * 0.38;
            const shiftZ = -Math.min(90, Math.abs(dx) * 0.35);
            exquisiteFrameWrapper.style.transform = `translateY(-18px) translateX(${shiftX}px) translateZ(${shiftZ}px) rotateY(${tiltY}deg)`;
          }
        }
      });

      window.addEventListener('pointerup', () => {
        if (state.isDraggingStrip) {
          state.isDraggingStrip = false;
          const projected = state.scrollX + state.velocityX * 11;
          const snapped = Math.round(projected);
          state.targetScrollX = snapped;
          state.activeIndex = wrapIndex(snapped, state.photos.length);
          updateCounterDisplay();
          setTimeout(() => { state.dragMoved = false; }, 60);
        }

        if (state.isDraggingSingle) {
          state.isDraggingSingle = false;
          const dx = state.singleDragDX;
          const dy = state.singleDragDY;

          exquisiteFrameWrapper.classList.remove('no-transition');

          if (dy > 65 && Math.abs(dy) > Math.abs(dx)) {
            exitSingleView(false);
          } else if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {
            albumStageWrapper.style.transform = '';
            albumStageWrapper.style.opacity = '';
            if (dx < 0) {
              switchSinglePhotoTo(state.activeIndex + 1, 'next');
            } else {
              switchSinglePhotoTo(state.activeIndex - 1, 'prev');
            }
          } else {
            exquisiteFrameWrapper.style.transform = '';
            albumStageWrapper.style.transform = '';
            albumStageWrapper.style.opacity = '';
          }

          state.singleDragDX = 0;
          state.singleDragDY = 0;
        }
      });

      singleStageOverlay.addEventListener('pointerdown', (e) => {
        if (state.viewMode !== 'single' || state.isTransitioningSingle) return;
        if (e.target.closest('button')) return;

        state.isDraggingSingle = true;
        state.pointerStartX = e.clientX;
        state.pointerStartY = e.clientY;
        state.singleDragDX = 0;
        state.singleDragDY = 0;
        exquisiteFrameWrapper.classList.add('no-transition');
      });

      let lastWheelTime = 0;
      window.addEventListener('wheel', (e) => {
        const now = performance.now();
        if (state.viewMode === 'strip') {
          if (state.introSweepActive) {
            triggerIntroSmoothBrake();
            return;
          }
          const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
          state.targetScrollX = state.targetScrollX + delta * 0.0045;
          clearTimeout(window._wheelSnapTimer);
          window._wheelSnapTimer = setTimeout(() => {
            state.targetScrollX = Math.round(state.targetScrollX);
            state.activeIndex = wrapIndex(state.targetScrollX, state.photos.length);
            updateCounterDisplay();
          }, 180);
        } else if (state.viewMode === 'single') {
          if (now - lastWheelTime < 480) return;
          if (e.deltaY > 45 && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
            lastWheelTime = now;
            exitSingleView(false);
          } else if (Math.abs(e.deltaX) > 30) {
            lastWheelTime = now;
            if (e.deltaX > 0) switchSinglePhotoTo(state.activeIndex + 1, 'next');
            else switchSinglePhotoTo(state.activeIndex - 1, 'prev');
          }
        }
      }, { passive: true });

      window.addEventListener('keydown', (e) => {
        if (state.viewMode === 'single') {
          if (e.key === 'ArrowRight') switchSinglePhotoTo(state.activeIndex + 1, 'next');
          else if (e.key === 'ArrowLeft') switchSinglePhotoTo(state.activeIndex - 1, 'prev');
          else if (e.key === 'ArrowDown' || e.key === 'Escape') exitSingleView(false);
        } else {
          if (e.key === 'ArrowRight') stepStripBy(1);
          else if (e.key === 'ArrowLeft') stepStripBy(-1);
          else if (e.key === 'ArrowUp' || e.key === 'Enter') enterSingleView(wrapIndex(state.scrollX, state.photos.length));
        }
      });
    }

    /******************************************************************
     * 8. MAIN 60FPS ANIMATION LOOP (Seamless 3D Circular Ring Layout)
     * 环形无限画卷：无论停在哪一张，左右两边都对称排布着照片，绝不会出现左空或右空的断层
     ******************************************************************/
    function animateLoop(now) {
      if (state.introSweepActive) {
        const elapsed = now - state.introStartTime;
        const t = Math.min(1, elapsed / state.introDuration);
        // Smooth Cubic Ease-Out over 2000ms: starts briskly, smoothly decelerates to 0 at 2.0s
        const easeOut = 1 - Math.pow(1 - t, 3.0);
        const prevScroll = state.scrollX;
        state.scrollX = state.introStartScroll + (state.introEndScroll - state.introStartScroll) * easeOut;
        state.velocityX = state.scrollX - prevScroll;

        if (t >= 1) {
          state.introSweepActive = false;
          state.scrollX = state.introEndScroll;
          state.targetScrollX = state.introEndScroll;
          state.activeIndex = wrapIndex(state.introEndScroll, state.photos.length);
          state.velocityX = 0;
          updateCounterDisplay();
        }
      } else if (!state.isDraggingStrip) {
        const diff = state.targetScrollX - state.scrollX;
        const springFactor = state.introBraking ? 0.085 : 0.12;
        const step = diff * springFactor;
        state.velocityX = step;
        state.scrollX += step;
        if (Math.abs(diff) < 0.002) {
          state.scrollX = state.targetScrollX;
          state.introBraking = false;
        }
      }

      const isMobile = window.innerWidth < 640;
      const baseSpacing = isMobile ? 205 : 265;
      const visualTotal = cardElements.length;

      for (let i = 0; i < visualTotal; i++) {
        const card = cardElements[i];
        // 计算环形最短距离，让画卷首尾无缝相连，左右两侧永远对称铺满照片
        const offset = getCircularOffset(i, state.scrollX, visualTotal);
        const absOffset = Math.abs(offset);

        // 环形背面超出视野的卡片隐藏，防止穿帮并保持60fps流畅
        if (absOffset > 4.2 || absOffset >= visualTotal / 2 - 0.15) {
          card.style.display = 'none';
          continue;
        } else {
          card.style.display = 'flex';
        }

        const sign = offset < 0 ? -1 : 1;
        const spreadX = offset * baseSpacing - sign * Math.max(0, absOffset - 1) * (isMobile ? 18 : 25);

        const depthZ = -Math.pow(absOffset, 1.2) * (isMobile ? 38 : 52);
        const archY = Math.pow(absOffset, 1.35) * 6;

        const floatY = Math.sin(now * 0.0022 + i * 1.05) * 6;
        const idleTiltZ = Math.cos(now * 0.0016 + i * 0.85) * 1.1;

        const coverflowRotY = Math.max(-28, Math.min(28, -offset * 12 - state.velocityX * 18));

        const scale = Math.max(0.76, 1 - absOffset * 0.048);
        // 环绕渐隐过渡，边缘柔和自然
        const edgeFade = absOffset > 3.2 ? Math.max(0, 1 - (absOffset - 3.2) * 1.1) : 1;
        const opacity = Math.max(0.55, 1 - absOffset * 0.06) * edgeFade;

        card.style.transform = `translate3d(${spreadX.toFixed(1)}px, ${(archY + floatY).toFixed(1)}px, ${depthZ.toFixed(1)}px) rotateY(${coverflowRotY.toFixed(2)}deg) rotateZ(${idleTiltZ.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
        card.style.opacity = opacity.toFixed(3);
        card.style.zIndex = String(100 - Math.round(absOffset * 12));

        card.classList.toggle('is-center', absOffset < 0.45);
      }

      updateDotsUI();
      if (!state.introSweepActive && !state.isDraggingStrip) {
        updateCounterDisplay();
      }

      requestAnimationFrame(animateLoop);
    }

    /******************************************************************
     * 9. SUBTLE FLOATING WARM LIGHT MOTES CANVAS
     ******************************************************************/
    function initAmbientCanvas() {
      const canvas = document.getElementById('ambientCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = (canvas.width = window.innerWidth);
      let h = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 28 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 1 + Math.random() * 2.2,
        vx: (Math.random() - 0.5) * 0.22,
        vy: -0.12 - Math.random() * 0.25,
        alpha: 0.12 + Math.random() * 0.28
      }));

      function drawParticles() {
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) {
          p.x += p.vx - state.velocityX * 1.4;
          p.y += p.vy;
          if (p.y < -10) p.y = h + 10;
          if (p.x < -10) p.x = w + 10;
          if (p.x > w + 10) p.x = -10;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(182, 149, 102, ${p.alpha})`;
          ctx.fill();
        }
        requestAnimationFrame(drawParticles);
      }
      drawParticles();
    }

    /******************************************************************
     * 10. MUSIC CONTROLLER
     ******************************************************************/
    function updateMusicUI(playing) {
      state.isPlayingMusic = playing;
      vinylDisc.classList.toggle('playing', playing);
      eqContainer.classList.toggle('playing', playing);
      musicStateLabel.textContent = playing ? '坂本龍一 · 正在播放' : '坂本龍一 · 已暂停';
    }

    function tryPlayMusic() {
      bgmAudio.volume = 0.78;
      const playPromise = bgmAudio.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            updateMusicUI(true);
            dismissWelcomeVeil();
          })
          .catch(() => {
            updateMusicUI(false);
          });
      }
    }

    function dismissWelcomeVeil() {
      if (!welcomeVeil || welcomeVeil.dataset.dismissed === 'true') return;
      welcomeVeil.dataset.dismissed = 'true';
      welcomeVeil.style.opacity = '0';
      welcomeVeil.style.pointerEvents = 'none';
      setTimeout(() => {
        welcomeVeil.style.display = 'none';
      }, 680);
      startOpeningAlbumSweep();
    }

    /******************************************************************
     * 11. WIRE ALL CONTROLS
     ******************************************************************/
    function wireControls() {
      welcomeVeil.addEventListener('click', () => {
        bgmAudio.play().then(() => updateMusicUI(true)).catch(() => {});
        dismissWelcomeVeil();
      });

      enterGalleryBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        bgmAudio.play().then(() => updateMusicUI(true)).catch(() => {});
        dismissWelcomeVeil();
      });

      musicToggleBtn.addEventListener('click', () => {
        if (bgmAudio.paused) {
          bgmAudio.play().then(() => updateMusicUI(true)).catch(() => {});
        } else {
          bgmAudio.pause();
          updateMusicUI(false);
        }
      });

      document.getElementById('replaySweepBtn').addEventListener('click', () => {
        startOpeningAlbumSweep();
      });

      document.getElementById('stripPrevBtn').addEventListener('click', () => {
        stepStripBy(-1);
      });
      document.getElementById('stripNextBtn').addEventListener('click', () => {
        stepStripBy(1);
      });
      document.getElementById('extractCenterBtn').addEventListener('click', () => {
        enterSingleView(wrapIndex(state.scrollX, state.photos.length));
      });

      document.getElementById('singlePrevBtn').addEventListener('click', () => {
        switchSinglePhotoTo(state.activeIndex - 1, 'prev');
      });
      document.getElementById('singleNextBtn').addEventListener('click', () => {
        switchSinglePhotoTo(state.activeIndex + 1, 'next');
      });
      document.getElementById('exitSingleBtn').addEventListener('click', () => {
        exitSingleView(false);
      });

      document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const isDark = document.body.classList.toggle('dark-theme');
        document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
      });
    }

    // Initialize Gallery
    window.addEventListener('DOMContentLoaded', () => {
      buildAlbumDOM();
      discoverAllPhotos();
      bindStageGestures();
      wireControls();
      initAmbientCanvas();
      requestAnimationFrame(animateLoop);
      tryPlayMusic();
    });
  </script>
</body>
</html>
